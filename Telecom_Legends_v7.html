ción", "Lee el fichero entero"], "ok": 0, "sol": "Para leer líneas completas se usa getline(f, s).", "calc": false}, {"asig": "PROG2", "tema": "T2 TAD y modularidad", "dif": 3, "q": "¿Para qué sirven las guardas #ifndef / #define / #endif en un .hpp?", "ops": ["Para evitar que el fichero se incluya dos veces en la misma unidad de compilación", "Para optimizar el código", "Para declarar plantillas", "Para depurar"], "ok": 0, "sol": "Sin ellas, incluir dos veces la cabecera daría redefiniciones.", "calc": false}, {"asig": "PROG2", "tema": "T2 TAD y modularidad", "dif": 2, "q": "¿Qué indica una postcondición de una operación de un TAD?", "ops": ["Lo que se garantiza que se cumple después de ejecutarla", "Lo que debe cumplirse antes de llamarla", "El tipo de retorno", "El nombre del módulo"], "ok": 0, "sol": "La precondición es lo que debe cumplirse antes de llamarla (se puede comprobar con assert).", "calc": false}, {"asig": "PROG2", "tema": "T3 Memoria dinámica", "dif": 1, "q": "¿Qué contiene un nodo de una lista simplemente enlazada?", "ops": ["El dato y un puntero al siguiente nodo", "Solo el dato", "Dos punteros y ningún dato", "Un array"], "ok": 0, "sol": "En la doblemente enlazada hay además un puntero al anterior.", "calc": false}, {"asig": "PROG2", "tema": "T4 Programación genérica y STL", "dif": 1, "q": "¿Cuál es la ventaja principal de la programación genérica?", "ops": ["Escribir el código una vez y usarlo con muchos tipos", "Que el programa sea más lento", "Evitar el uso de clases", "No necesitar compilador"], "ok": 0, "sol": "Por ejemplo, list<T> o vector<T> sirven para cualquier tipo T.", "calc": false}, {"asig": "PROG2", "tema": "T5 Colecciones", "dif": 3, "q": "¿Qué estructura usarías para recorrer elementos por orden de llegada, como en una cola de impresión?", "ops": ["queue", "stack", "set", "map"], "ok": 0, "sol": "FIFO: el primero en llegar es el primero en imprimirse.", "calc": false}, {"asig": "RST1", "tema": "T1 Fundamentos de transmisión", "dif": 3, "q": "Hay que cubrir 400 m a 10 MHz con una atenuación total de 20 dB como máximo. Con los datos de la tabla, ¿qué cables sirven?", "ops": ["RG-58 y RG-11", "Solo UTP", "Los tres", "Solo RG-11"], "ok": 0, "sol": "Se necesitan como mucho $\\frac{20}{4}=5$ dB/100 m. UTP: $6{,}5\\cdot4=26$ dB (no). RG-58: $4{,}6\\cdot4=18{,}4$ dB (sí). RG-11: $2\\cdot4=8$ dB (sí). Error típico: no pasar los 400 m a \"4 tramos de 100 m\".", "calc": true, "tabla": {"titulo": "Atenuación a 10 MHz", "cols": ["Cable", "α (dB/100 m)"], "filas": [["UTP cat. 5", "6,5"], ["RG-58", "4,6"], ["RG-11", "2,0"]]}}, {"asig": "RST1", "tema": "T1 Fundamentos de transmisión", "dif": 2, "q": "Trampa típica: un enlace \"de 1 MB/s\", ¿cuántos Mbps son?", "ops": ["8 Mbps", "1 Mbps", "0,125 Mbps", "1,024 Mbps"], "ok": 0, "sol": "B mayúscula = bytes. $1\\text{ MB/s}\\cdot8=8$ Mbps. Confundir B y b es el error más típico del tema.", "calc": true}, {"asig": "RST1", "tema": "T1 Fundamentos de transmisión", "dif": 4, "q": "Un mensaje de 1000 bytes cruza 3 tramos con store-and-forward (despreciando el procesado). Con la tabla, ¿cuánto vale $D$?", "ops": ["14,6 ms", "8 ms", "6,6 ms", "13 ms"], "ok": 0, "sol": "Tramo 1: $t_{tx}=\\frac{8000}{2\\cdot10^6}=4$ ms; $t_{prop}=1$ ms. Tramo 2: $t_{tx}=8$ ms; $t_{prop}=0{,}5$ ms. Tramo 3: $t_{tx}=0{,}08$ ms; $t_{prop}=1{,}02$ ms. Total $\\approx13{,}08+1{,}52=14{,}6$ ms. Error típico: sumar un solo $t_{tx}$.", "calc": true, "tabla": {"titulo": "Tramos", "cols": ["Tramo", "R", "d (km)", "v_prop (m/s)"], "filas": [["1", "2 Mbps", "200", "2·10^8"], ["2", "1 Mbps", "100", "2·10^8"], ["3", "100 Mbps", "204", "2·10^8"]]}}, {"asig": "RST1", "tema": "T2 Introducción a las redes", "dif": 3, "q": "Mensaje de 4 paquetes, cada uno con $t_{tx,paq}=1$ ms, por 3 nodos intermedios store-and-forward (sin propagación ni esperas). ¿Tiempo total?", "ops": ["7 ms", "16 ms", "4 ms", "12 ms"], "ok": 0, "sol": "$(N_{nodos}+1)t_{tx}+(N_{paq}-1)t_{tx}=4\\cdot1+3\\cdot1=7$ ms. Sin solapamiento saldrían $4\\cdot4=16$ ms (error típico).", "calc": true}, {"asig": "RST1", "tema": "T2 Introducción a las redes", "dif": 2, "q": "En conmutación de circuitos, el retardo de establecimiento...", "ops": ["Se paga una vez al principio y luego los datos no esperan en colas", "Se paga en cada paquete", "No existe", "Depende del número de paquetes"], "ok": 0, "sol": "Tras establecer el circuito los datos fluyen sin store-and-forward. Por eso compensa en transferencias largas.", "calc": false}, {"asig": "RST1", "tema": "T3 Multiplexación", "dif": 3, "q": "PDH: un multiplexor E1 agrupa afluentes de 64 kbps. ¿Por qué la salida E2 (8,448 Mbps) es mayor que $4\\times2{,}048=8{,}192$ Mbps?", "ops": ["Por los bits de alineación, control y justificación que se añaden", "Por un error de redondeo", "Porque se codifica en Manchester", "Porque SDH obliga a ello"], "ok": 0, "sol": "$8{,}448-8{,}192=0{,}256$ Mbps se usan para la alineación de trama y la justificación (relleno) de los afluentes plesiócronos.", "calc": true}, {"asig": "RST1", "tema": "T4 Acceso al medio", "dif": 3, "q": "CSMA/CD: si se duplica la velocidad $R$ manteniendo la distancia máxima, ¿qué pasa con $L_{min}$?", "ops": ["Se duplica", "Se reduce a la mitad", "No cambia", "Se cuadruplica"], "ok": 0, "sol": "$L_{min}=2t_{prop}R$: es proporcional a $R$. Por eso, al subir la velocidad hay que reducir la distancia o alargar la trama mínima.", "calc": false}, {"asig": "RST1", "tema": "T4 Acceso al medio", "dif": 4, "q": "Con los datos de la tabla, ¿qué técnica tiene mayor $S_{max}$?", "ops": ["Sondeo", "ALOHA ranurado", "Reserva", "Las tres igual"], "ok": 0, "sol": "Sondeo: $\\frac{1}{1+0{,}05}=0{,}952$. Reserva: $\\frac{1}{1+0{,}1}=0{,}909$. ALOHA ranurado: $1/e\\approx0{,}368$.", "calc": true, "tabla": {"titulo": "Datos", "cols": ["Parámetro", "Valor"], "filas": [["t_tx", "1 ms"], ["τ (sondeo)", "0,05 ms"], ["t_mr (reserva)", "0,1 ms"]]}}, {"asig": "RST1", "tema": "T5 Dimensionado de redes", "dif": 3, "q": "Con la tabla de Erlang-B (bloqueo del 1 %), ¿cuántos servidores hacen falta como mínimo para 2,2 E?", "ops": ["7", "6", "5", "8"], "ok": 0, "sol": "Hay que buscar el primer $c$ cuya columna admite al menos 2,2 E: con 6 solo se admiten 1,91 E y con 7, 2,50 E. Error típico: quedarse con el valor más cercano por debajo.", "calc": false, "tabla": {"titulo": "Erlang-B, B = 1 %", "cols": ["c", "I máx (E)"], "filas": [["5", "1,36"], ["6", "1,91"], ["7", "2,50"], ["8", "3,13"]]}}, {"asig": "RST1", "tema": "T5 Dimensionado de redes", "dif": 2, "q": "Trampa: en la fórmula de Little $N=\\lambda T$, ¿qué $\\lambda$ se usa en un sistema con pérdidas?", "ops": ["$\\lambda_{ef}$, la tasa que realmente entra", "$\\lambda$ ofrecida siempre", "$\\mu$", "$c\\mu$"], "ok": 0, "sol": "Si hay bloqueo, solo cuentan las llegadas aceptadas: $\\lambda_{ef}=\\lambda(1-P_B)$.", "calc": false}, {"asig": "RST2", "tema": "T2 Encaminamiento", "dif": 3, "q": "Vector distancia: el nodo A recibe estos vectores de sus vecinos. ¿Cuál es su distancia mínima a D y por dónde?", "ops": ["7, vía C", "9, vía B", "10, vía E", "3, vía C"], "ok": 0, "sol": "Por B: $2+7=9$. Por C: $4+3=7$. Por E: $1+9=10$. Mínimo: 7 por C. Error típico: elegir al vecino más cercano (E) o la distancia anunciada más corta sin sumar el coste del enlace.", "calc": true, "tabla": {"titulo": "Vecinos de A", "cols": ["Vecino", "Coste A–vecino", "Distancia anunciada a D"], "filas": [["B", "2", "7"], ["C", "4", "3"], ["E", "1", "9"]]}}, {"asig": "RST2", "tema": "T1 Intercambio de datos (errores y flujo)", "dif": 3, "q": "Con la tabla, ¿qué ventana mínima hace falta para trabajar en la zona óptima?", "ops": ["11", "10", "6", "21"], "ok": 0, "sol": "$a=\\frac{t_{prop}}{t_{tx}}=\\frac{5}{1}=5$, luego $N_{opt}=1+2a=11$.", "calc": true, "tabla": {"titulo": "Enlace", "cols": ["t_tx", "t_prop"], "filas": [["1 ms", "5 ms"]]}}, {"asig": "RST2", "tema": "T1 Intercambio de datos (errores y flujo)", "dif": 2, "q": "Trampa: con 3 bits de número de secuencia, ¿por qué retroceder a N no admite $N=8$?", "ops": ["El receptor no distinguiría una ventana nueva de la retransmisión de la anterior si se pierden todos los ACK", "Porque 8 no es primo", "Porque el CRC lo impide", "Sí lo admite"], "ok": 0, "sol": "Con $N=2^k$, tras perderse todos los ACK el receptor confundiría las retransmisiones con tramas nuevas. Por eso $N\\le2^k-1$.", "calc": false}, {"asig": "RST2", "tema": "T1 Intercambio de datos (errores y flujo)", "dif": 4, "q": "Un CRC con $g(x)$ de grado $r$ detecta siempre...", "ops": ["Todas las ráfagas de error de longitud $\\le r$", "Cualquier error", "Solo errores de 1 bit", "Ningún error doble"], "ok": 0, "sol": "Por eso se eligen polinomios generadores de grado 16 o 32 en la práctica.", "calc": false}, {"asig": "RST2", "tema": "T3 Modelos de referencia", "dif": 2, "q": "¿En qué capa se hace la fragmentación y el direccionamiento lógico (IP)?", "ops": ["Red", "Enlace", "Transporte", "Física"], "ok": 0, "sol": "La capa de red direcciona y encamina extremo a extremo a través de varias redes.", "calc": false}, {"asig": "RST2", "tema": "T4 Redes de telecomunicación", "dif": 3, "q": "¿Qué hace un ISP en un punto neutro (IXP)?", "ops": ["Intercambia tráfico directamente con otros ISP", "Asigna direcciones MAC", "Cifra el tráfico", "Hace de DNS raíz"], "ok": 0, "sol": "Así el tráfico entre clientes de distintos ISP no tiene que salir por enlaces internacionales caros.", "calc": false}, {"asig": "ED1", "tema": "T1 Diseño lógico y VHDL", "dif": 3, "q": "¿Puede una salida de la familia A atacar a una entrada de la familia B (tabla)?", "ops": ["No: $V_{OH}(A)=2{,}7$ V $<V_{IH}(B)=3{,}5$ V", "Sí, las dos son de 5 V", "No: $V_{OL}(A)>V_{IL}(B)$", "Sí, con cualquier fan-out"], "ok": 0, "sol": "El nivel bajo cumple ($0{,}5\\le1{,}5$), pero el alto no: B puede no reconocer el 1. Es el problema clásico de TTL atacando a CMOS de 5 V; se arregla con una resistencia de pull-up o un adaptador de niveles.", "calc": false, "tabla": {"titulo": "Niveles (V)", "cols": ["Familia", "V_OH", "V_OL", "V_IH", "V_IL"], "filas": [["A (TTL)", "2,7", "0,5", "2,0", "0,8"], ["B (CMOS 5 V)", "4,9", "0,1", "3,5", "1,5"]]}}, {"asig": "ED1", "tema": "T3 Circuitos secuenciales", "dif": 4, "q": "Con la tabla, ¿frecuencia máxima y se cumple el hold?", "ops": ["28,6 MHz y sí se cumple el hold", "28,6 MHz y no se cumple el hold", "33,3 MHz y sí se cumple", "40 MHz y sí se cumple"], "ok": 0, "sol": "$F_{max}=\\frac{1}{8+22+5}=\\frac{1}{35\\text{ ns}}=28{,}6$ MHz. Hold: $t_{pRmin}+t_{ppmin}=2+1=3\\ge2=t_h$: se cumple. Error típico: usar los máximos para el hold.", "calc": true, "tabla": {"titulo": "Tiempos (ns)", "cols": ["Parámetro", "mín", "máx"], "filas": [["t_pR (registro)", "2", "8"], ["t_pp (lógica)", "1", "22"], ["t_su", "—", "5"], ["t_h", "—", "2"]]}}, {"asig": "ED1", "tema": "T1 Diseño lógico y VHDL", "dif": 2, "q": "En VHDL, ¿qué falta en este process para que sea un biestable D síncrono?\n```vhdl\nprocess (CLK)\nbegin\n  Q <= D;\nend process;\n```", "ops": ["La condición if rising_edge(CLK) then", "Nada, ya es un biestable", "Poner D en la lista de sensibilidad", "Usar una variable"], "ok": 0, "sol": "Sin rising_edge, el process se ejecuta en cualquier cambio de CLK (los dos flancos).", "calc": false}, {"asig": "ED1", "tema": "T2 Circuitos combinacionales", "dif": 3, "q": "Para implementar $F(A,B,C)=\\sum m(1,2,4,7)$ con un mux 4:1 y $A,B$ en la selección, ¿qué va en las entradas $I_0..I_3$?", "ops": ["$C,\\ \\overline C,\\ \\overline C,\\ C$", "$0,1,1,0$", "$C,C,\\overline C,\\overline C$", "$1,0,0,1$"], "ok": 0, "sol": "Para cada $AB$: 00 → m1 ($C=1$) da $C$; 01 → m2 ($C=0$) da $\\overline C$; 10 → m4 da $\\overline C$; 11 → m7 da $C$. Es $A\\oplus B\\oplus C$.", "calc": false}, {"asig": "ED1", "tema": "T3 Circuitos secuenciales", "dif": 3, "q": "En un contador asíncrono (ripple) de 4 bits con $t_{pd}=10$ ns por biestable, ¿peor retardo hasta que se estabiliza la cuenta?", "ops": ["40 ns", "10 ns", "20 ns", "80 ns"], "ok": 0, "sol": "Cada biestable dispara al siguiente: los retardos se acumulan ($4\\cdot10$). En el síncrono todos conmutan a la vez.", "calc": true}, {"asig": "ED1", "tema": "T3 Circuitos secuenciales", "dif": 2, "q": "Trampa: un latch D con la habilitación activa...", "ops": ["Copia la entrada continuamente (es transparente)", "Solo cambia en el flanco", "Mantiene el estado", "Pone la salida en alta impedancia"], "ok": 0, "sol": "Por eso los sistemas síncronos usan biestables por flanco y no latches.", "calc": false}, {"asig": "ED2", "tema": "T3 Memorias, osciladores y reloj", "dif": 2, "q": "Con el mapa de memoria de la tabla, ¿qué chip se selecciona con la dirección 0x1A00?", "ops": ["RAM1", "RAM0", "ROM", "Ninguno"], "ok": 0, "sol": "0x1A00 está entre 0x1000 y 0x1FFF.", "calc": false, "tabla": {"titulo": "Mapa de memoria", "cols": ["Chip", "Desde", "Hasta"], "filas": [["RAM0", "0x0000", "0x0FFF"], ["RAM1", "0x1000", "0x1FFF"], ["ROM", "0x2000", "0x3FFF"]]}}, {"asig": "ED2", "tema": "T1 Características de los CI", "dif": 3, "q": "Con la tabla del datasheet, ¿cuál es el fan-out?", "ops": ["10", "20", "40", "16"], "ok": 0, "sol": "Nivel bajo: $\\frac{16}{1{,}6}=10$. Nivel alto: $\\frac{0{,}8}{0{,}04}=20$. Se toma el menor. Error típico: quedarse con el nivel alto.", "calc": true, "tabla": {"titulo": "Datasheet", "cols": ["Parámetro", "Valor"], "filas": [["I_OL", "16 mA"], ["I_IL", "1,6 mA"], ["I_OH", "0,8 mA"], ["I_IH", "40 µA"]]}}, {"asig": "ED2", "tema": "T1 Características de los CI", "dif": 4, "q": "Un CI disipa 3 W con $T_{a}=40$ °C y $T_{j,max}=150$ °C. Si $\\theta_{jc}=5$ °C/W y $\\theta_{cs}=1$ °C/W, ¿qué $\\theta_{sa}$ máxima puede tener el disipador?", "ops": ["30,7 °C/W", "36,7 °C/W", "110 °C/W", "24 °C/W"], "ok": 0, "sol": "$\\theta_{ja,max}=\\frac{150-40}{3}=36{,}7$ °C/W, luego $\\theta_{sa}\\le36{,}7-5-1=30{,}7$ °C/W.", "calc": true}, {"asig": "ED2", "tema": "T2 Familias lógicas", "dif": 3, "q": "¿Por qué la salida en colector abierto es más lenta en el flanco de subida?", "ops": ["La sube una resistencia de pull-up que carga despacio la capacidad", "Porque el transistor satura", "Porque usa ECL", "No es más lenta"], "ok": 0, "sol": "La bajada la hace el transistor (baja impedancia); la subida depende de la constante $RC$ del pull-up.", "calc": false}, {"asig": "ED2", "tema": "T4 Máquinas ASM", "dif": 2, "q": "Trampa: en una ASM, ¿cuándo cambia una salida de Moore escrita en un estado?", "ops": ["Al entrar en ese estado (tras el flanco)", "En mitad del ciclo cuando cambia una entrada", "Nunca", "Antes del flanco"], "ok": 0, "sol": "Las de Moore solo dependen del estado; las condicionales (Mealy) pueden cambiar con las entradas dentro del ciclo.", "calc": false}, {"asig": "ED2", "tema": "T6 Microprocesadores", "dif": 3, "q": "En el procesador del tema, ¿qué ventaja tiene el microcódigo frente a un control cableado?", "ops": ["Cambiar o ampliar instrucciones modificando la ROM de microcódigo, sin rediseñar la lógica", "Siempre es más rápido", "No necesita reloj", "Elimina el data path"], "ok": 0, "sol": "El control cableado suele ser más rápido, pero el microprogramado es más flexible.", "calc": false}, {"asig": "ED2", "tema": "T6 Microprocesadores", "dif": 2, "q": "Un bucle que se repite 5 veces con un contador necesita al menos...", "ops": ["Decrementar el contador y un salto condicional según el flag Z", "Un salto incondicional solo", "Una interrupción", "Un puerto de salida"], "ok": 0, "sol": "Por ejemplo: DEC R; JNZ bucle.", "calc": false}, {"asig": "SYS", "tema": "T2 Sistemas LTI", "dif": 3, "q": "Con la tabla de $h[n]$ y $x[n]=\\delta[n]+\\delta[n-1]$, ¿cuánto vale $y[1]$?", "ops": ["1,5", "1", "0,75", "2"], "ok": 0, "sol": "$y[n]=h[n]+h[n-1]$, luego $y[1]=h[1]+h[0]=0{,}5+1=1{,}5$.", "calc": true, "tabla": {"titulo": "h[n]", "cols": ["n", "0", "1", "2"], "filas": [["h[n]", "1", "0,5", "0,25"]]}}, {"asig": "SYS", "tema": "T5 Muestreo", "dif": 3, "q": "Trampa: una señal tiene $B=2\\pi\\cdot5000$ rad/s. ¿Frecuencia de muestreo mínima en Hz?", "ops": ["10 kHz", "5 kHz", "$2\\pi\\cdot10$ kHz", "31,4 kHz"], "ok": 0, "sol": "$B$ en rad/s corresponde a 5 kHz; Nyquist pide $f_s>10$ kHz. Error típico: mezclar rad/s y Hz.", "calc": true}, {"asig": "SYS", "tema": "T3 Análisis de Fourier", "dif": 3, "q": "Pulso rectangular de anchura $T$ centrado en 0. ¿Primer nulo de su TF en $\\omega$?", "ops": ["$\\omega=\\frac{2\\pi}{T}$", "$\\omega=\\frac{\\pi}{T}$", "$\\omega=T$", "$\\omega=\\frac{1}{T}$"], "ok": 0, "sol": "$X(\\omega)=T\\,\\mathrm{sinc}\\left(\\frac{\\omega T}{2\\pi}\\right)$, cuyo primer nulo está donde el argumento vale 1.", "calc": false}, {"asig": "SYS", "tema": "T1 Señales y sistemas", "dif": 2, "q": "¿Es invariante en el tiempo $y(t)=x(2t)$?", "ops": ["No: un retardo $t_0$ en la entrada produce un retardo $t_0/2$ en la salida", "Sí", "Solo si $x$ es periódica", "Solo si es causal"], "ok": 0, "sol": "$x(2t-t_0)\\ne x(2(t-t_0))$.", "calc": false}, {"asig": "SYS", "tema": "T4 Transformadas de Laplace y Z", "dif": 4, "q": "$H(z)=\\frac{1}{1-1{,}2z^{-1}}$ con ROC $|z|<1{,}2$. ¿Cómo es el sistema?", "ops": ["Estable pero no causal", "Causal y estable", "Causal e inestable", "Ni causal ni estable"], "ok": 0, "sol": "La ROC es el interior: secuencia \"por la izquierda\" (no causal). Contiene $|z|=1$, así que es estable. Error típico: decidir solo por la posición del polo.", "calc": false}, {"asig": "MAT3", "tema": "T2 Sistemas de ecuaciones lineales", "dif": 3, "q": "Matriz ampliada ya escalonada (tabla). ¿Cómo es el sistema?", "ops": ["Incompatible", "Compatible determinado", "Compatible indeterminado", "No se puede saber"], "ok": 0, "sol": "La última fila dice $0=5$: $\\mathrm{rg}(A)=2<\\mathrm{rg}(A|b)=3$.", "calc": false, "tabla": {"titulo": "(A | b)", "cols": ["x", "y", "z", "b"], "filas": [["1", "2", "1", "3"], ["0", "1", "-1", "2"], ["0", "0", "0", "5"]]}}, {"asig": "MAT3", "tema": "T1 Aritmética entera y modular", "dif": 3, "q": "Resuelve $3x\\equiv4\\pmod 7$:", "ops": ["$x\\equiv6$", "$x\\equiv4$", "$x\\equiv1$", "No tiene solución"], "ok": 0, "sol": "$3^{-1}\\equiv5\\pmod7$ ($3\\cdot5=15\\equiv1$). $x\\equiv4\\cdot5=20\\equiv6$. Comprobación: $3\\cdot6=18\\equiv4$.", "calc": true}, {"asig": "MAT3", "tema": "T5 Diagonalización", "dif": 4, "q": "Trampa: una matriz $3\\times3$ con valores propios 2, 2 y 5. ¿Es diagonalizable?", "ops": ["Depende: solo si el subespacio propio de $\\lambda=2$ tiene dimensión 2", "Sí, siempre", "No, nunca", "Solo si es simétrica"], "ok": 0, "sol": "Hay que comprobar que $\\mathrm{rg}(A-2I)=1$ (multiplicidad geométrica 2).", "calc": false}, {"asig": "MAT3", "tema": "T4 Aplicaciones lineales", "dif": 2, "q": "$f(x,y)=(x+y,\\;x-y)$. ¿Cuánto vale $f(3,1)$?", "ops": ["$(4,2)$", "$(2,4)$", "$(3,1)$", "$(4,-2)$"], "ok": 0, "sol": "$(3+1,\\;3-1)$.", "calc": false}, {"asig": "MAT3", "tema": "T6 Espacios euclídeos", "dif": 3, "q": "Proyección ortogonal de $v=(1,2)$ sobre la recta generada por $u=(1,1)$:", "ops": ["$(\\frac32,\\frac32)$", "$(1,1)$", "$(3,3)$", "$(\\frac12,\\frac12)$"], "ok": 0, "sol": "$\\frac{\\langle v,u\\rangle}{\\langle u,u\\rangle}u=\\frac32(1,1)$. Error típico: no dividir entre $\\langle u,u\\rangle=2$.", "calc": true}, {"asig": "PROG2", "tema": "T4 Programación genérica y STL", "dif": 3, "q": "Trampa: ¿qué tamaño tienen estos vectores?\n```cpp\nvector<int> a(3);\nvector<int> b{3};\n```", "ops": ["a tiene 3 elementos (ceros) y b tiene 1 elemento (el 3)", "Los dos tienen 3 elementos", "Los dos tienen 1 elemento", "a tiene 1 y b tiene 3"], "ok": 0, "sol": "Los paréntesis llaman al constructor de tamaño; las llaves, a la lista de inicialización.", "calc": false}, {"asig": "PROG2", "tema": "T3 Memoria dinámica", "dif": 4, "q": "¿Qué problema tiene este código?\n```cpp\nint* p = new int(4);\nint* q = p;\ndelete p;\ndelete q;\n```", "ops": ["Doble liberación: q apunta a la misma memoria ya liberada", "Fuga de memoria", "Ninguno", "No compila"], "ok": 0, "sol": "Liberar dos veces es comportamiento indefinido. Es justo lo que pasa con una copia superficial en clases sin constructor de copia.", "calc": false}, {"asig": "PROG2", "tema": "T3 Memoria dinámica", "dif": 3, "q": "Con una capacidad inicial de 1 que se duplica al llenarse (como el Vector del tema), ¿qué capacidad tiene tras 5 push_back (tabla)?", "ops": ["8", "5", "16", "6"], "ok": 0, "sol": "Va 1 → 2 → 4 → 8: el 5.º elemento ya no cabe en 4.", "calc": false, "tabla": {"titulo": "Capacidad", "cols": ["Tras el push_back n.º", "Tamaño", "Capacidad"], "filas": [["1", "1", "1"], ["2", "2", "2"], ["3", "3", "4"], ["4", "4", "4"], ["5", "5", "?"]]}}, {"asig": "PROG2", "tema": "T1 Ficheros", "dif": 3, "q": "¿Qué imprime si el fichero contiene \"7 8\"?\n```cpp\nint n, c = 0;\nwhile (!f.eof()) {\n  f >> n;\n  ++c;\n}\ncout << c;\n```", "ops": ["Puede imprimir 3: cuenta una vuelta extra si hay un salto de línea final", "Siempre 2", "0", "1"], "ok": 0, "sol": "Sin lectura por adelantado, si queda un salto de línea al final, eof() aún no está activo y se hace una lectura fallida más. Es la trampa que la lectura por adelantado evita.", "calc": false}, {"asig": "PROG2", "tema": "T2 TAD y modularidad", "dif": 2, "q": "¿Dónde debe ir la implementación de una función miembro no inline?", "ops": ["En el .cpp del módulo", "En el .hpp siempre", "En el main", "En un fichero de datos"], "ok": 0, "sol": "Las plantillas son la excepción: suelen implementarse en el .hpp.", "calc": false}, {"asig": "PROG2", "tema": "T4 Programación genérica y STL", "dif": 4, "q": "¿Por qué las plantillas (template) suelen implementarse en el .hpp y no en un .cpp aparte?", "ops": ["Porque el compilador necesita ver el código para instanciarlas con cada tipo", "Por estilo", "Porque son más rápidas", "Porque no se pueden compilar"], "ok": 0, "sol": "Si la implementación está en otro .cpp, la instanciación para un tipo concreto no existe y falla el enlazado.", "calc": false}, {"asig": "PROG2", "tema": "T5 Colecciones", "dif": 4, "q": "Complejidad de insertar en un std::map con $n$ elementos:", "ops": ["$O(\\log n)$", "$O(1)$", "$O(n)$", "$O(n\\log n)$"], "ok": 0, "sol": "Se implementa como un árbol equilibrado y ordenado por clave.", "calc": false}, {"asig": "RST2", "tema": "T1 Intercambio de datos (errores y flujo)", "dif": 3, "q": "Canal con $BER=10^{-4}$ y un código con palabras de $n=12$ bits que corrige $e=2$ errores. ¿BER codificada?", "ops": ["$5{,}5\\cdot10^{-11}$", "$2{,}2\\cdot10^{-10}$", "$1{,}65\\cdot10^{-7}$", "$10^{-4}$"], "ok": 0, "sol": "$PER\\approx\\binom{n}{e+1}BER^{e+1}=\\binom{12}{3}10^{-12}=2{,}2\\cdot10^{-10}$ y $BER_{cod}=\\frac{e+1}{n}PER=\\frac{3}{12}\\cdot2{,}2\\cdot10^{-10}=5{,}5\\cdot10^{-11}$.\n\n🔎 «2,2·10⁻¹⁰» es la PER (falta el factor (e+1)/n); «1,65·10⁻⁷» sale de usar e en vez de e+1; «10⁻⁴» sería un código que no corrige.", "calc": true}, {"asig": "RST2", "tema": "T1 Intercambio de datos (errores y flujo)", "dif": 2, "q": "¿Es lineal el código $C=\\{110011,\\,010111,\\,111111,\\,000000\\}$?", "ops": ["No: la suma de dos palabras no siempre está en el código", "Sí: contiene la palabra 000000", "Sí: todas sus palabras tienen 6 bits", "No: le falta la palabra todo ceros"], "ok": 0, "sol": "110011 + 010111 = 100100, que no pertenece al código. Tener la palabra nula es necesario, pero no suficiente. (Y sí la contiene.)", "calc": false}, {"asig": "RST2", "tema": "T1 Intercambio de datos (errores y flujo)", "dif": 2, "q": "Para $C=\\{110011,\\,010111,\\,111111,\\,000000\\}$: longitud del mensaje, redundancia y eficiencia.", "ops": ["$k=2$, 4 bits de redundancia, $\\eta=\\frac13$", "$k=4$, 2 bits de redundancia, $\\eta=\\frac23$", "$k=6$, sin redundancia, $\\eta=1$", "$k=2$, 4 bits de redundancia, $\\eta=\\frac12$"], "ok": 0, "sol": "$|C|=4=2^k\\Rightarrow k=2$; $n=6$, así que $n-k=4$ y $\\eta=\\frac{k}{n}=\\frac{2}{6}=\\frac13$.", "calc": true}, {"asig": "RST2", "tema": "T1 Intercambio de datos (errores y flujo)", "dif": 3, "q": "Checksum (suma en complemento a 1) de la cabecera de 4 bytes de la tabla:", "ops": ["00001110", "00001101", "11110001", "00010000"], "ok": 0, "sol": "Se suman los 4 bytes en binario: 00000011 + 00000000 + 11110000 + 00011010 = 1 00001101. En complemento a 1 el acarreo final se vuelve a sumar: 00001101 + 1 = 00001110 (equivale a +3 + 0 − 15 + 26 = +14).\n\n🔎 «00001101» olvida sumar el acarreo; «11110001» complementa el resultado (el tema da la suma tal cual).", "calc": true, "tabla": {"titulo": "Cabecera", "cols": ["Byte", "Valor"], "filas": [["1", "00000011"], ["2", "00000000"], ["3", "11110000"], ["4", "00011010"]]}}, {"asig": "RST2", "tema": "T1 Intercambio de datos (errores y flujo)", "dif": 2, "q": "Un paquete protege solo su cabecera de 4 bytes con 1 byte de checksum. ¿Qué código es?", "ops": ["C(40,32)", "C(32,8)", "C(40,8)", "C(5,4)"], "ok": 0, "sol": "Mensaje protegido: 4 bytes = 32 bits = k. Redundancia: 8 bits = n − k, así que n = 40. Error típico: contar en bytes, C(5,4).", "calc": false}, {"asig": "RST2", "tema": "T1 Intercambio de datos (errores y flujo)", "dif": 2, "q": "Código $c_1=m_1,\\;c_2=m_2,\\;c_3=m_3,\\;c_4=m_1+m_2+m_3$. ¿Distancia y capacidad?", "ops": ["$d=2$: detecta errores de peso 1 y no corrige", "$d=3$: detecta 2 errores y corrige 1", "$d=1$: no detecta ningún error", "$d=4$: detecta 3 errores y corrige 1"], "ok": 0, "sol": "Es un código de paridad par C(4,3), lineal: d = peso mínimo no nulo = 2. Detecta d − 1 = 1 error y corrige ⌊(d − 1)/2⌋ = 0.", "calc": false}, {"asig": "RST2", "tema": "T1 Intercambio de datos (errores y flujo)", "dif": 3, "q": "Con ese código de paridad par C(4,3) se envía el mensaje 000 y se recibe 1100. ¿Qué ocurre?", "ops": ["No detecta error, aunque ha habido 2 (e = 1100)", "Detecta un error de peso 1", "Detecta los 2 errores y los corrige", "No ha habido errores: 1100 es palabra código"], "ok": 0, "sol": "1100 pertenece al código, así que el decodificador no detecta nada. Pero se envió x = 0000: e = x + y = 1100, de peso 2. Un código de d = 2 no detecta todos los errores dobles.", "calc": false}, {"asig": "RST2", "tema": "T1 Intercambio de datos (errores y flujo)", "dif": 3, "q": "Código cíclico sistemático C(7,4) con $g(x)=x^3+x^2+1$. ¿Palabra código para el mensaje 0101?", "ops": ["0101110", "0101000", "0101011", "1100101"], "ok": 0, "sol": "$m(x)=x^2+1$; $x^3m(x)=x^5+x^3$; el resto de dividir entre $g(x)$ es $x^2+x$ (110). Palabra: mensaje + resto = 0101110.\n\n🔎 «0101000» no añade el resto; «0101011» lee el resto al revés; «1100101» pone la redundancia delante.", "calc": true}, {"asig": "RST2", "tema": "T1 Intercambio de datos (errores y flujo)", "dif": 3, "q": "Con C(7,4) y $g(x)=x^3+x^2+1$, ¿cuáles de las palabras recibidas 1100010, 1001110 y 0000101 son erróneas?", "ops": ["Las tres", "Solo 1100010", "Ninguna", "1100010 y 0000101"], "ok": 0, "sol": "Se divide cada palabra recibida entre $g(x)$: las tres dan resto distinto de 0, así que en las tres se detecta error.", "calc": true}, {"asig": "RST2", "tema": "T1 Intercambio de datos (errores y flujo)", "dif": 3, "q": "Código cíclico $C=\\{000,101\\}$ sobre un canal con $BER=10^{-3}$ y $R=1200$ kbps. ¿Velocidad efectiva y BER codificada?", "ops": ["400 kbps y $BER_{cod}\\approx10^{-3}$", "400 kbps y $BER_{cod}\\approx10^{-6}$", "1200 kbps y $BER_{cod}\\approx10^{-3}$", "800 kbps y $BER_{cod}\\approx10^{-3}$"], "ok": 0, "sol": "$k=1$, $n=3$: $R_{ef}=\\frac{k}{n}R=400$ kbps. La distancia es 2: no corrige ningún error, así que $BER_{cod}\\approx BER$.", "calc": true}, {"asig": "RST2", "tema": "T1 Intercambio de datos (errores y flujo)", "dif": 3, "q": "En el código cíclico $\\{000,101\\}$, ¿qué patrón de error de peso 2 NO se detecta?", "ops": ["101", "110", "011", "111"], "ok": 0, "sol": "$g(x)=x^2+1$ (101). Un patrón no se detecta si $e(x)$ es divisible entre $g(x)$: $e=101=g(x)$, resto 0. 110 y 011 dan resto ≠ 0 (se detectan) y 111 tiene peso 3.", "calc": false}, {"asig": "RST2", "tema": "T1 Intercambio de datos (errores y flujo)", "dif": 2, "q": "Por la desigualdad de Singleton, ¿cuántos bits de redundancia hacen falta como mínimo para corregir 3 errores?", "ops": ["6", "3", "7", "4"], "ok": 0, "sol": "Corregir $e=3$ exige $d\\ge2e+1=7$, y Singleton dice $d\\le(n-k)+1$: $n-k\\ge6$.\n\n🔎 «7» es la distancia, no la redundancia.", "calc": true}, {"asig": "RST2", "tema": "T1 Intercambio de datos (errores y flujo)", "dif": 3, "q": "Un protocolo debe transmitir $2^6$ mensajes distintos con un código que corrija 3 errores por palabra. ¿Tamaño mínimo de paquete?", "ops": ["12 bits", "9 bits", "13 bits", "6 bits"], "ok": 0, "sol": "$k=6$. Para $e=3$: $d=7$ y, por Singleton, $n-k\\ge6$: $n=12$ bits. La velocidad se reduce a la mitad ($\\eta=\\frac{6}{12}$).", "calc": true}, {"asig": "RST2", "tema": "T1 Intercambio de datos (errores y flujo)", "dif": 2, "q": "Se añade un bit de paridad IMPAR a k bits de información. ¿Qué es seguro de este código?", "ops": ["Es un código bloque (pero no lineal)", "Es un código lineal", "Es un código cíclico", "Corrige los errores de peso 1"], "ok": 0, "sol": "Con paridad impar la palabra todo ceros no pertenece al código, así que no es lineal (ni cíclico). Su distancia es 2: detecta 1 error, no corrige. Sí es un código bloque C(k+1, k).", "calc": false}, {"asig": "RST2", "tema": "T1 Intercambio de datos (errores y flujo)", "dif": 2, "q": "¿Qué afirmación sobre los códigos cíclicos es cierta?", "ops": ["$n-k$ es igual al grado de $g(x)$", "Existen códigos cíclicos no lineales", "$g(x)$ es siempre la palabra de peso mínimo", "Detectan siempre todo error de peso $\\le$ grado de $g(x)$"], "ok": 0, "sol": "En un código cíclico el número de bits de redundancia es igual al grado del polinomio generador. Todo cíclico es lineal.", "calc": false}, {"asig": "RST2", "tema": "T1 Intercambio de datos (errores y flujo)", "dif": 2, "q": "Un código lineal con distancia mínima 7...", "ops": ["Detecta todos los errores de peso 6 o menos", "Corrige 4 o menos errores", "No sirve para técnicas FEC", "Tiene longitud $n=7$"], "ok": 0, "sol": "Detecta d − 1 = 6 y corrige ⌊(7 − 1)/2⌋ = 3. La distancia no fija la longitud n.", "calc": false}, {"asig": "RST2", "tema": "T1 Intercambio de datos (errores y flujo)", "dif": 3, "q": "Patrón de error 00101000111101010100000000000. ¿Qué ráfagas contiene?", "ops": ["Ráfagas de longitud 3 y 10", "Ráfagas de longitud 3, 4 y 5", "Una única ráfaga de longitud 4", "Ninguna ráfaga definida"], "ok": 0, "sol": "Ráfaga de longitud Le: Le bits consecutivos con el primero y el último erróneos, separada de la siguiente por al menos Le bits. «101» (Le = 3) va seguida de 3 ceros; después «1111010101» (Le = 10) y ya solo ceros.", "calc": false}, {"asig": "RST2", "tema": "T1 Intercambio de datos (errores y flujo)", "dif": 3, "q": "Código C(6,3) lineal y sistemático con las palabras 111000, 001011 y 101010. ¿Qué es cierto?", "ops": ["Su distancia de Hamming es 2", "Su distancia de Hamming es 3", "Tiene $2^6$ palabras código", "Si llega 100011, el error más probable es 010000"], "ok": 0, "sol": "Por linealidad, 111000 + 101010 = 010010 es palabra código, de peso 2: d = 2. Tiene 2³ = 8 palabras. Para 100011 hay dos errores de peso 1 igual de probables (000010 y 010000).", "calc": false}, {"asig": "RST2", "tema": "T1 Intercambio de datos (errores y flujo)", "dif": 2, "q": "¿Cuándo conviene FEC (corrección en el receptor) en lugar de ARQ?", "ops": ["Sin canal de retorno o con mucho retardo de propagación", "Cuando el canal casi no tiene errores", "Cuando se busca la máxima eficiencia k/n", "Solo en las redes de área local"], "ok": 0, "sol": "ARQ necesita canal de retorno y es poco adecuado con mucho retardo. FEC se usa en satélites, sondas espaciales o almacenamiento (CD).", "calc": false}, {"asig": "RST2", "tema": "T1 Intercambio de datos (errores y flujo)", "dif": 1, "q": "Según el tema, ¿qué BER típica tiene la fibra óptica?", "ops": ["$10^{-8}$", "$10^{-3}$", "$10^{-6}$", "$10^{-1}$"], "ok": 0, "sol": "Valores típicos del tema: par trenzado $10^{-6}$, fibra óptica $10^{-8}$ y canal inalámbrico $10^{-3}$.", "calc": false}, {"asig": "RST2", "tema": "T1 Intercambio de datos (errores y flujo)", "dif": 2, "q": "Entrelazado con un código C(15,10) y un tamaño medio de ráfaga de 3. ¿Dimensión de la matriz?", "ops": ["3 filas × 15 columnas", "15 filas × 3 columnas", "3 filas × 10 columnas", "10 filas × 15 columnas"], "ok": 0, "sol": "Cada fila es una palabra código (n = 15 columnas) y la profundidad (número de filas) coincide con el tamaño medio de ráfaga.", "calc": false}, {"asig": "RST2", "tema": "T1 Intercambio de datos (errores y flujo)", "dif": 3, "q": "Matriz de entrelazado de 6 filas (palabras de 3 bits con 1 bit de redundancia). Llega una ráfaga de longitud 7. ¿Protege el sistema?", "ops": ["No: la ráfaga (7) supera las 6 filas", "Sí: el entrelazado protege de cualquier ráfaga", "Sí: 7 es menor que los 18 bits de la matriz", "No: el entrelazado solo sirve para errores simples"], "ok": 0, "sol": "Con L ≥ número de filas, una palabra recibe 2 errores. Con 1 bit de redundancia la distancia es como mucho 2: solo detecta todos los errores de peso 1.", "calc": false}, {"asig": "RST2", "tema": "T1 Intercambio de datos (errores y flujo)", "dif": 2, "q": "Código $c_1=m_1+m_2,\\;c_2=m_2,\\;c_3=m_1,\\;c_4=m_1+m_2$ ($d=2$). Para el 5.º bit se barajan $c_5=0$ o $c_5=m_1$. ¿Cuál es mejor?", "ops": ["$c_5=m_1$: la distancia pasa de 2 a 3", "$c_5=0$: no añade errores nuevos", "Da igual: las dos tienen eficiencia 2/5", "$c_5=0$: mantiene el código sistemático"], "ok": 0, "sol": "Las dos dejan η = 2/5, pero un bit constante no separa más las palabras (d sigue en 2). Con c₅ = m₁ el código queda {00000, 11011, 10111, 01100}: d = 3, detecta 2 y corrige 1.", "calc": false}, {"asig": "RST2", "tema": "T1 Intercambio de datos (errores y flujo)", "dif": 3, "q": "Código $\\{00000,10011,01101,11110\\}$, canal con $BER=10^{-6}$. ¿BER codificada?", "ops": ["$4\\cdot10^{-12}$", "$10^{-11}$", "$10^{-6}$", "$2\\cdot10^{-12}$"], "ok": 0, "sol": "$k=2$, $n=5$, $d=3$ (corrige $e=1$). $PER\\approx\\binom{5}{2}BER^2=10^{-11}$ y $BER_{cod}=\\frac{e+1}{n}PER=\\frac25\\cdot10^{-11}=4\\cdot10^{-12}$.", "calc": true}, {"asig": "RST2", "tema": "T1 Intercambio de datos (errores y flujo)", "dif": 3, "q": "Canal de 1 Mbps, $t_{prop}=3$ ms, $BER=10^{-4}$ y paquetes de 1000 bits. Throughput normalizado de parada y espera:", "ops": ["0,129", "0,143", "0,905", "0,576"], "ok": 0, "sol": "$t_{tx}=1$ ms, $a=3$, $PER=1-(1-10^{-4})^{1000}=0{,}0952$. $S=\\frac{1-P}{1+2a}=\\frac{0{,}9048}{7}=0{,}129$.\n\n🔎 «0,143» ignora los errores ($\\frac17$); «0,905» es repetición selectiva con ventana óptima; «0,576», retroceder a N.", "calc": true, "tabla": {"titulo": "Enlace", "cols": ["R", "t_prop", "BER", "L"], "filas": [["1 Mbps", "3 ms", "10^-4", "1000 bits"]]}}, {"asig": "RST2", "tema": "T1 Intercambio de datos (errores y flujo)", "dif": 3, "q": "Mismo enlace (1 Mbps, $t_{prop}=3$ ms, $BER=10^{-4}$, $L=1000$ bits) con retroceder a N y $N\\ge1+2a$. ¿$S$?", "ops": ["0,576", "0,905", "0,129", "0,525"], "ok": 0, "sol": "$S=\\frac{1-P}{1+2aP}=\\frac{0{,}9048}{1+6\\cdot0{,}0952}=0{,}576$ (con $N=7$).\n\n🔎 «0,525» es la fórmula de retroceder a N con $N=6<1+2a$.", "calc": true}, {"asig": "RST2", "tema": "T1 Intercambio de datos (errores y flujo)", "dif": 4, "q": "Mismo enlace (a = 3, PER = 0,0952) con repetición selectiva y ventana $N=6<1+2a$. ¿$S$?", "ops": ["0,776", "0,905", "0,857", "0,525"], "ok": 0, "sol": "Zona no óptima: $S=\\frac{N(1-P)}{1+2a}=\\frac{6\\cdot0{,}9048}{7}=0{,}776$.\n\n🔎 «0,905» exigiría $N\\ge7$; «0,857» = 6/7 ignora los errores; «0,525» es retroceder a N con N = 6.", "calc": true}, {"asig": "RST2", "tema": "T1 Intercambio de datos (errores y flujo)", "dif": 3, "q": "Repetición selectiva sin errores: paquetes de 1000 bytes, 2000 kbps y $t_{prop}=10$ ms. ¿Ventanas mínimas para throughput máximo y bits de identificación?", "ops": ["N = M = 6 y 4 bits", "N = 6, M = 1 y 3 bits", "N = M = 11 y 5 bits", "N = M = 6 y 3 bits"], "ok": 0, "sol": "$t_{tx}=\\frac{8000}{2\\cdot10^6}=4$ ms, $a=2{,}5$, $N_{opt}=1+2a=6$ y $M=N$. En repetición selectiva $I\\ge2N=12$: $2^4=16$, 4 bits (con 3 bits, I = 8 no llega).", "calc": true}, {"asig": "RST2", "tema": "T1 Intercambio de datos (errores y flujo)", "dif": 4, "q": "Enlace por satélite: $t_{prop}=250$ ms, 1 Mbps y paquetes de 2000 bits, con repetición selectiva. ¿Bits de identificación para trabajar con ventana óptima?", "ops": ["9 bits", "8 bits", "10 bits", "7 bits"], "ok": 0, "sol": "$t_{tx}=2$ ms, $a=125$, $N_{opt}=251$. En repetición selectiva $I=2N=502$: $2^8=256<502\\le2^9$, así que 9 bits.", "calc": true}, {"asig": "RST2", "tema": "T1 Intercambio de datos (errores y flujo)", "dif": 4, "q": "$a=80$, paquetes de 1000 bits, 1 byte de identificador y $BER=10^{-3}$ ($PER=0{,}632$). ¿Qué protocolo rinde más?", "ops": ["Repetición selectiva ($S\\approx0{,}29$)", "Retroceder a N ($S\\approx0{,}86$)", "Rinden igual", "Parada y espera"], "ok": 0, "sol": "Retroceder a N ($N=161$): $S=\\frac{1-P}{1+2aP}=0{,}0036$. Repetición selectiva ($N=128$): $S=\\frac{N(1-P)}{1+2a}=0{,}292$. Con muchos errores gana repetición selectiva; con $PER=0{,}001$ ganaría retroceder a N (0,86 frente a 0,79).", "calc": true}, {"asig": "RST2", "tema": "T1 Intercambio de datos (errores y flujo)", "dif": 2, "q": "Con 3 bits de identificación (I = 8), ¿ventanas de transmisión máximas en retroceder a N y en repetición selectiva (M = N)?", "ops": ["7 y 4", "8 y 4", "7 y 7", "4 y 4"], "ok": 0, "sol": "Retroceder a N: N ≤ I − 1 = 7. Repetición selectiva: N ≤ I/2 = 4.", "calc": false}, {"asig": "RST2", "tema": "T1 Intercambio de datos (errores y flujo)", "dif": 2, "q": "Retransmisión implícita frente a explícita:", "ops": ["Implícita: expira el temporizador; explícita: llega un NACK", "Implícita: llega un NACK; explícita: expira el temporizador", "Las dos se basan en un NACK", "La implícita no retransmite nunca"], "ok": 0, "sol": "Con retransmisión implícita el receptor no envía nada al detectar el error y el emisor espera al temporizador. Con la explícita el receptor manda un NACK y se retransmite antes.", "calc": false}, {"asig": "RST2", "tema": "T1 Intercambio de datos (errores y flujo)", "dif": 3, "q": "Ventana de 4 con paquetes numerados de 0 a 7 en retroceder a N. Se envían P0–P3, llegan ACK0 y ACK1 y después ACK3 (sin ACK2). ¿Qué ha pasado?", "ops": ["Se perdió ACK2: P2 y P3 llegaron bien", "P2 llegó mal y P3 bien", "Se perdieron P2 y P3", "El receptor confirmó P3 sin tener P2"], "ok": 0, "sol": "En retroceder a N se confirma en orden: no se puede mandar ACK3 sin haber recibido P2. En repetición selectiva sí cabrían las dos explicaciones.", "calc": false}, {"asig": "RST2", "tema": "T1 Intercambio de datos (errores y flujo)", "dif": 1, "q": "Para un fichero entre Málaga y Japón, ¿parada y espera o ventana deslizante?", "ops": ["Ventana deslizante: $a\\gg1$", "Parada y espera: es más sencilla", "Parada y espera: hay menos errores", "Da igual: S no depende de a"], "ok": 0, "sol": "Con un retardo de propagación grande, $a\\gg1$ y parada y espera da $S\\approx\\frac{1}{1+2a}$, muy bajo. La ventana deslizante llena el canal.", "calc": false}, {"asig": "RST2", "tema": "T1 Intercambio de datos (errores y flujo)", "dif": 3, "q": "Repetición selectiva a 100 Mbit/s, paquetes de 500 bytes, $BER=5\\cdot10^{-5}$ y ventana suficientemente grande. ¿Throughput máximo?", "ops": ["81,87 Mbit/s", "100 Mbit/s", "97,53 Mbit/s", "18,13 Mbit/s"], "ok": 0, "sol": "$PER=1-(1-5\\cdot10^{-5})^{4000}=0{,}1813$ y $S_{max}=1-PER=0{,}8187$: 81,87 Mbit/s.\n\n🔎 «97,53» usa 500 bits en vez de 4000; «18,13» es lo que se pierde.", "calc": true}, {"asig": "RST2", "tema": "T1 Intercambio de datos (errores y flujo)", "dif": 4, "q": "Mismo enlace (100 Mbit/s, 500 bytes, $v_{prop}=2{,}4\\cdot10^8$ m/s) con ventana máxima de 100. ¿Distancia máxima manteniendo el throughput máximo?", "ops": ["475,2 km", "950,4 km", "396 km", "237,6 km"], "ok": 0, "sol": "Hace falta $N\\ge1+2a$: $a\\le49{,}5$. $t_{tx}=40\\ \\mu s$, así que $t_{prop}\\le1{,}98$ ms y $d\\le1{,}98\\cdot10^{-3}\\cdot2{,}4\\cdot10^8=475{,}2$ km.\n\n🔎 «950,4» olvida el 2 de $2a$; «396» usa $2\\cdot10^8$ m/s.", "calc": true}, {"asig": "RST2", "tema": "T1 Intercambio de datos (errores y flujo)", "dif": 3, "q": "Retroceder a N con tramas de 1500 bytes a 10 Gbit/s sobre 200 km de fibra ($v=2\\cdot10^8$ m/s). ¿Ventana para throughput máximo?", "ops": ["1668", "834", "1667", "3336"], "ok": 0, "sol": "$t_{tx}=1{,}2\\ \\mu s$, $t_{prop}=1$ ms, $a=833{,}3$ y $N\\ge1+2a=1667{,}7$: $N=1668$. Con $I=N+1$ hacen falta 11 bits (2 bytes).", "calc": true}, {"asig": "RST2", "tema": "T1 Intercambio de datos (errores y flujo)", "dif": 2, "q": "En retroceder a N, cuando llega ACKi...", "ops": ["Confirma todos los paquetes hasta Pi incluido", "Confirma solo el paquete Pi", "Pide retransmitir Pi", "Confirma Pi y los siguientes"], "ok": 0, "sol": "Confirmación por grupo: ACKi confirma los paquetes de la ventana de transmisión hasta Pi incluido.", "calc": false}, {"asig": "RST2", "tema": "T1 Intercambio de datos (errores y flujo)", "dif": 2, "q": "En repetición selectiva, el receptor...", "ops": ["Acepta desordenados dentro de su ventana; solo se reenvía el erróneo", "Descarta todo lo que llega fuera de orden", "Trabaja siempre con M = 1", "Hace retransmitir toda la ventana"], "ok": 0, "sol": "Por eso necesita M > 1 y más memoria, pero rinde más con errores. Descartar lo desordenado y retransmitir toda la ventana es retroceder a N.", "calc": false}, {"asig": "RST2", "tema": "T2 Encaminamiento", "dif": 1, "q": "¿Qué diferencia hay entre encaminamiento (routing) y envío (forwarding)?", "ops": ["Routing actualiza las tablas; forwarding reenvía cada paquete", "Son dos nombres de lo mismo", "Forwarding calcula las rutas óptimas", "Routing solo existe en las LAN"], "ok": 0, "sol": "Routing: algoritmo y protocolo que mantienen las tablas. Forwarding: consultar la tabla y poner el paquete en ruta hacia su destino.", "calc": false}, {"asig": "RST2", "tema": "T2 Encaminamiento", "dif": 2, "q": "Una tabla con una entrada por red (no por terminal) y una entrada «default» es...", "ops": ["Network-specific con ruta por defecto", "Host-specific", "De ruta completa (source routing)", "Estática por inundación"], "ok": 0, "sol": "Host-specific: una entrada por terminal. Network-specific: una por red. Default: lo que no coincide sale por la entrada por defecto.", "calc": false}, {"asig": "RST2", "tema": "T2 Encaminamiento", "dif": 2, "q": "¿Qué afirmación es cierta?", "ops": ["Split Horizon acelera la convergencia del vector distancia", "Bellman-Ford calcula el árbol del estado de enlace", "En vector distancia se informa a todos del coste a los vecinos", "El mayor problema del VD es el volumen de control"], "ok": 0, "sol": "Split Horizon: no anunciar a un vecino las rutas que pasan por él; reduce el tiempo de actualización de las tablas. El estado de enlace usa Dijkstra, y el VD informa a los vecinos del coste a todos los destinos.", "calc": false}, {"asig": "RST2", "tema": "T2 Encaminamiento", "dif": 2, "q": "¿Qué afirmación sobre los protocolos de encaminamiento es cierta?", "ops": ["BGP se basa en vector distancia", "OSPF es de vector distancia", "OSPF es un protocolo interdominio", "El jerárquico siempre da rutas óptimas"], "ok": 0, "sol": "OSPF: estado de enlace, intradominio. BGP: interdominio, basado en vector distancia, pero envía la ruta completa.", "calc": false}, {"asig": "RST2", "tema": "T2 Encaminamiento", "dif": 2, "q": "¿Qué es cierto del encaminamiento jerárquico?", "ops": ["Las rutas pueden tener más saltos", "Se usa en las redes LAN", "Las tablas son más largas", "La dirección dice si el usuario está conectado"], "ok": 0, "sol": "Reduce el tamaño de las tablas (de 17 a 7 entradas en el ejemplo del tema), pero a cambio algunas rutas salen más largas.", "calc": false}, {"asig": "RST2", "tema": "T2 Encaminamiento", "dif": 2, "q": "En una red orientada a conexión, una vez establecida la ruta...", "ops": ["Todos los paquetes de la conexión siguen la misma ruta", "Cada paquete se encamina por separado", "Cada paquete lleva origen y destino", "La ruta cambia con cada paquete"], "ok": 0, "sol": "La ruta (circuito virtual) se elige en el establecimiento y los paquetes llevan el identificador del CV. En datagramas cada paquete lleva @origen y @destino y se encamina por separado.", "calc": false}, {"asig": "RST2", "tema": "T2 Encaminamiento", "dif": 3, "q": "A tiene enlaces a B (coste 10) y a C (coste 5) y recibe los vectores de la tabla. ¿Vector distancia de A (destinos A, B, C, D, E)?", "ops": ["[0, 8, 5, 9, 7]", "[0, 10, 5, 11, 7]", "[0, 8, 5, 11, 7]", "[0, 3, 0, 1, 2]"], "ok": 0, "sol": "Bellman-Ford distribuido: D_A(X) = min(10 + B_X, 5 + C_X). B: min(10, 5 + 3) = 8. C: 5. D: min(11, 9) = 9. E: min(15, 7) = 7.\n\n🔎 «[0, 10, 5, 11, 7]» no aprovecha las rutas por C; «[0, 3, 0, 1, 2]» olvida sumar el coste del enlace.", "calc": true, "tabla": {"titulo": "Vectores recibidos", "cols": ["Destino", "VD de B", "VD de C"], "filas": [["A", "8", "5"], ["B", "0", "3"], ["C", "3", "0"], ["D", "1", "4"], ["E", "5", "2"]]}}, {"asig": "RST2", "tema": "T2 Encaminamiento", "dif": 3, "q": "En el ejemplo anterior (A–B = 10, A–C = 5, B anuncia 1 hasta D y C anuncia 4), ¿por qué vecino sale A hacia D?", "ops": ["Por C (coste 9)", "Por B (coste 11)", "Por B (coste 1)", "Directo, sin vecino"], "ok": 0, "sol": "Por B: 10 + 1 = 11. Por C: 5 + 4 = 9. Gana C. Error típico: elegir a quien anuncia menos sin sumar el coste del enlace.", "calc": true}, {"asig": "RST2", "tema": "T2 Encaminamiento", "dif": 2, "q": "Nodo A con vecinos B (coste 10) y C (coste 5) en una red de 5 nodos. ¿Vector inicial $d^0$ del Bellman-Ford distribuido?", "ops": ["[0, 10, 5, ∞, ∞]", "[0, ∞, ∞, ∞, ∞]", "[0, 10, 5, 0, 0]", "[∞, 10, 5, ∞, ∞]"], "ok": 0, "sol": "A se pone 0 a sí mismo, usa el coste de sus enlaces para sus vecinos e ∞ para lo que aún no conoce. [0, ∞, …] es el inicio del Bellman-Ford centralizado.", "calc": false}, {"asig": "RST2", "tema": "T2 Encaminamiento", "dif": 2, "q": "En el algoritmo de Dijkstra, ¿qué nodo pasa de TENT a PATH en cada paso?", "ops": ["El de menor coste acumulado", "El primero que se añadió a TENT", "El vecino con el enlace más barato", "El que tiene más vecinos"], "ok": 0, "sol": "Se fija el nodo con menor coste acumulado, se examina su LSP y se actualizan en TENT sus vecinos no fijados.", "calc": false}, {"asig": "RST2", "tema": "T2 Encaminamiento", "dif": 2, "q": "En el estado de enlace, ¿qué contiene un LSP y cómo se distribuye?", "ops": ["El coste a sus vecinos, por inundación", "El coste a todos los destinos, solo a sus vecinos", "La tabla completa, solo al router por defecto", "La ruta completa, con source routing"], "ok": 0, "sol": "«Se informa a todo el mundo del coste a los vecinos». Contiene además número de secuencia y edad para descartar copias en la inundación.", "calc": false}, {"asig": "RST2", "tema": "T2 Encaminamiento", "dif": 2, "q": "¿Para qué sirve el mensaje Hello de OSPF?", "ops": ["Para descubrir quiénes son los nodos vecinos", "Para inundar el coste a los vecinos", "Para confirmar un Link State Update", "Para pedir una entrada de la base de datos"], "ok": 0, "sol": "Hello: descubrir vecinos. Link state update: coste a los vecinos, por inundación. Link state ack: confirmación. Database description y Link state request: sincronizar la base de datos.", "calc": false}, {"asig": "RST2", "tema": "T2 Encaminamiento", "dif": 3, "q": "¿Cómo evita BGP la cuenta a infinito?", "ops": ["Cada router anuncia la ruta exacta, no solo el coste", "Con un temporizador hold-down", "Inundando LSP con números de secuencia", "Usando Dijkstra en cada router"], "ok": 0, "sol": "Al recibir rutas completas, un router descarta las que pasan por él mismo o por el enlace caído (en el ejemplo F descarta IFGCD y EFGCD y elige FBCD).", "calc": false}, {"asig": "RST2", "tema": "T2 Encaminamiento", "dif": 2, "q": "Encaminamiento estático:", "ops": ["Tablas manuales, sin adaptación y sin tráfico de control", "Tablas que se actualizan por inundación", "Cada router calcula rutas con Dijkstra", "Se adapta solo a los cambios de topología"], "ok": 0, "sol": "Las tablas las configura el administrador y no cambian hasta que se vuelva a tocar: adaptación nula, pero sin tráfico de control.", "calc": false}, {"asig": "RST2", "tema": "T2 Encaminamiento", "dif": 3, "q": "¿Qué inconveniente tiene la solución del hold-down time?", "ops": ["El tiempo es arbitrario y no elimina del todo la cuenta a infinito", "Exige conocer toda la topología", "Necesita inundar LSP", "Solo funciona en redes jerárquicas"], "ok": 0, "sol": "Durante el hold-down se anuncia coste ∞ al router caído. El tiempo es arbitrario, a veces la convergencia es aún más lenta y no resuelve del todo el problema.", "calc": false}, {"asig": "RST2", "tema": "T2 Encaminamiento", "dif": 3, "q": "En el ejercicio de 5 regiones, la ruta jerárquica 3B → 5C cuesta 4 y la óptima, 3. ¿Por qué?", "ops": ["La tabla solo conoce la región destino, no el mejor nodo dentro de ella", "Porque los enlaces jerárquicos cuestan más", "Porque OSPF no admite jerarquía", "Porque se forma un bucle de encaminamiento"], "ok": 0, "sol": "Con jerarquía 3B tiene una sola entrada para la región 5 (salida por 4A): tablas más cortas, pero a veces rutas más largas.", "calc": false}, {"asig": "RST2", "tema": "T3 Modelos de referencia", "dif": 2, "q": "Datos de 100 B en OSI con cabeceras de aplicación 12 B, presentación 5, sesión 5, transporte 8, red 20 y enlace 14 + 4 de cola. ¿Tamaño de la PDU de enlace?", "ops": ["168 B", "150 B", "164 B", "118 B"], "ok": 0, "sol": "100 + 12 + 5 + 5 + 8 + 20 = 150 B llegan a enlace como SDU; con cabecera y cola: 150 + 14 + 4 = 168 B.\n\n🔎 «150» es la SDU de enlace; «164» olvida la cola.", "calc": true}, {"asig": "RST2", "tema": "T3 Modelos de referencia", "dif": 2, "q": "Mensaje de 100 B sobre TCP (20 B), IP (20 B) y Ethernet (18 B). ¿Qué porcentaje de los bits transmitidos es carga útil?", "ops": ["63,3 %", "71,4 %", "83,3 %", "100 %"], "ok": 0, "sol": "$\\frac{100}{100+20+20+18}=\\frac{100}{158}=63{,}3$ %. Con 1000 B subiría al 94,5 %: las cabeceras pesan menos en paquetes grandes.\n\n🔎 «71,4 %» olvida Ethernet; «83,3 %» solo cuenta TCP.", "calc": true}, {"asig": "RST2", "tema": "T3 Modelos de referencia", "dif": 3, "q": "Voz sobre TCP/IP: cabeceras aplicación 10 B, TCP 20, IP 20 y acceso a red 18. La sobrecarga total es el 20 % de la trama. ¿Bytes útiles por paquete?", "ops": ["272 B", "340 B", "322 B", "68 B"], "ok": 0, "sol": "Sobrecarga = 10 + 20 + 20 + 18 = 68 B = 20 % de la trama: trama = 340 B y útiles 340 − 68 = 272 B. La PDU IP mide 272 + 10 + 20 + 20 = 322 B.", "calc": true}, {"asig": "RST2", "tema": "T3 Modelos de referencia", "dif": 3, "q": "Fichero de 1,5 MB (1 MB = 10⁶ B) sobre TCP/IP; IP admite como máximo 1480 B de datos y TCP e IP añaden 20 B cada una. ¿Cuántos segmentos?", "ops": ["1028", "1014", "1027", "1029"], "ok": 0, "sol": "Cada segmento lleva 1480 − 20 = 1460 B de datos: 1 500 000/1460 = 1027,4, así que 1028 (el último con 580 B).\n\n🔎 «1014» olvida la cabecera TCP dentro de los 1480 B; «1027» redondea hacia abajo.", "calc": true}, {"asig": "RST2", "tema": "T3 Modelos de referencia", "dif": 2, "q": "¿A qué capas OSI corresponden, en orden, el entramado, la segmentación, la compresión y la sincronización?", "ops": ["Enlace, transporte, presentación y sesión", "Física, red, aplicación y sesión", "Enlace, red, sesión y presentación", "Red, transporte, presentación y enlace"], "ok": 0, "sol": "Entramado: enlace. Segmentación: transporte. Compresión: presentación. Sincronización (checkpoints): sesión. La ruta la decide red y el control de flujo está en enlace y transporte.", "calc": false}, {"asig": "RST2", "tema": "T3 Modelos de referencia", "dif": 1, "q": "Escuchas Spotify mientras navegas. ¿Qué dirección separa los paquetes de las dos aplicaciones?", "ops": ["El puerto (capa de transporte)", "La dirección IP (capa de red)", "La dirección MAC (capa de enlace)", "La URI (capa de aplicación)"], "ok": 0, "sol": "La IP identifica la máquina, que es la misma; el puerto identifica el proceso (direccionamiento en punto de servicio de la capa de transporte).", "calc": false}, {"asig": "RST2", "tema": "T3 Modelos de referencia", "dif": 2, "q": "Un repetidor y un puente (bridge), ¿en qué capas trabajan?", "ops": ["Repetidor en la física; puente en la de enlace", "Los dos en la de enlace", "Repetidor en enlace; puente en red", "Repetidor en red; puente en física"], "ok": 0, "sol": "El repetidor regenera la señal. El puente además filtra el tráfico con una tabla MAC → puerto y divide la red en segmentos.", "calc": false}, {"asig": "RST2", "tema": "T3 Modelos de referencia", "dif": 3, "q": "Un equipo de la LAN1 envía un mensaje de apagado a DOS equipos de la LAN2. ¿Cómo es su dirección destino?", "ops": ["Global, no jerárquica y multicast", "Local, jerárquica y broadcast", "Global, jerárquica y unicast", "Local, no jerárquica y anycast"], "ok": 0, "sol": "Es una MAC: global (OUI del IEEE + fabricante), no jerárquica, y designa a un grupo, así que es multicast. La de origen sería global, no jerárquica y unicast. No existen MAC anycast.", "calc": false}, {"asig": "RST2", "tema": "T3 Modelos de referencia", "dif": 3, "q": "Con la tabla del puente, llega por el puerto 2 una trama con origen 64:2B:13:45:61:14 y destino 64:2B:13:45:61:15. ¿Qué hace?", "ops": ["La reenvía por el puerto 1 y añade …:14 → puerto 2", "La descarta y no cambia la tabla", "La reenvía por el puerto 1 y no cambia la tabla", "La descarta y añade …:15 → puerto 2"], "ok": 0, "sol": "Aprende: el origen …:14 no está en la tabla, así que lo añade asociado al puerto 2. Reenvía: el destino …:15 es desconocido, así que la regenera por todos los puertos salvo el de llegada (puerto 1).", "calc": false, "tabla": {"titulo": "Tabla del puente en t₀", "cols": ["Dirección MAC", "Puerto"], "filas": [["74:2B:13:45:61:41", "1"], ["74:2B:13:45:61:42", "1"], ["64:2B:13:45:61:12", "2"], ["64:2B:13:45:61:13", "2"]]}}, {"asig": "RST2", "tema": "T3 Modelos de referencia", "dif": 2, "q": "En NFC, ¿qué capa OSI no está presente y por qué?", "ops": ["La de red: solo se comunican dos dispositivos", "La física: no hay señal de radio", "La de enlace: no hay tramas", "La de aplicación: no hay usuarios"], "ok": 0, "sol": "Si origen y destino están en el mismo enlace, normalmente no hace falta la capa de red.", "calc": false}, {"asig": "RST2", "tema": "T3 Modelos de referencia", "dif": 2, "q": "Orden de las primitivas de servicio en un envío confirmado:", "ops": ["Request, Indication, Response, Confirm", "Indication, Request, Confirm, Response", "Request, Response, Indication, Confirm", "Confirm, Request, Indication, Response"], "ok": 0, "sol": "Request: el emisor pide el envío. Indication: el receptor avisa a su capa superior. Response: esta responde. Confirm: el emisor recibe la confirmación.", "calc": false}, {"asig": "RST2", "tema": "T3 Modelos de referencia", "dif": 2, "q": "En un protocolo, la «temporización» define...", "ops": ["Cuándo se comunica (secuencia de mensajes)", "Qué significa cada campo de bits", "El formato de los datos", "La velocidad de la capa física"], "ok": 0, "sol": "Semántica: qué se comunica (significado). Sintaxis: cómo (formato). Temporización: cuándo (secuencia).", "calc": false}, {"asig": "RST2", "tema": "T3 Modelos de referencia", "dif": 2, "q": "¿Qué caracteriza al diseño cross-layer?", "ops": ["Hay comunicación directa entre capas no adyacentes", "Reduce el número de capas respecto a OSI", "Cada capa es totalmente independiente", "Es el modelo TCP/IP de 4 capas"], "ok": 0, "sol": "Cross-layer rompe la regla de usar solo la capa inmediatamente inferior: menos latencia, pero los protocolos ya no son independientes. Layer-less compacta funciones en menos capas.", "calc": false}, {"asig": "RST2", "tema": "T3 Modelos de referencia", "dif": 3, "q": "¿Qué diferencia function opsN(c,cands,F){const out=[F(c)];for(const v of cands){if(!isFinite(v)||v<=0)continue;const f=F(v);if(!out.includes(f))out.push(f);if(out.length===4)break}let k=2;while(out.length<4&&k<40){const f=F(c*k);if(!out.includes(f))out.push(f);k++}return out}
function opsI(c,cands,F=v=>String(v)){const out=[F(c)];for(const v of cands){if(v===undefined||v===null||!isFinite(v))continue;const f=F(v);if(!out.includes(f))out.push(f);if(out.length===4)break}let k=1;while(out.length<4&&k<40){const f=F(c+k*(k%2?1:-1)*Math.ceil(k/2));if(!out.includes(f))out.push(f);k++}return out}
function opsS(c,cands){const out=[c];cands.forEach(v=>{if(v&&!out.includes(v)&&out.length<4)out.push(v)});return out}

function normAsig(a){a=String(a||'').trim();const up=a.toUpperCase().replace(/\s+/g,'');if(ASIG[up])return up;const l=a.toLowerCase();
 if(/redes.*\b(2|dos|ii)\b|rst ?2/.test(l))return 'RST2';if(/redes|rst/.test(l))return 'RST1';if(/se[ñn]al|sys/.test(l))return 'SYS';
 if(/(electr|ed).*\b(2|dos|ii)\b|ed2/.test(l))return 'ED2';if(/electr|ed ?1/.test(l))return 'ED1';if(/mat/.test(l))return 'MAT3';if(/prog/.test(l))return 'PROG2';return null}
function temaKey(t){const m=String(t).match(/^\s*(?:tema\s*)?T?\s*(\d+)/i);return m?'T'+m[1]:String(t).trim().toLowerCase()}
function normQ(o){
 if(!o||typeof o!=='object')throw 'no es una pregunta';
 const asig=normAsig(o.asig||o.asignatura);if(!asig)throw 'asignatura desconocida ('+(o.asig||'vacía')+')';
 const tema=String(o.tema||'').trim();if(!tema)throw 'falta el tema';
 const q=String(o.q||o.pregunta||o.enunciado||'').trim();if(!q)throw 'falta el enunciado';
 let ops=o.ops||o.opciones;if(!Array.isArray(ops)||ops.length<2)throw 'necesita al menos 2 opciones';ops=ops.map(x=>String(x));
 let ok=o.ok??o.correcta;if(typeof ok==='string'&&!/^\d+$/.test(ok))ok=ops.indexOf(ok);ok=parseInt(ok);if(!(ok>=0&&ok<ops.length))throw 'el campo "ok" no apunta a ninguna opción';
 const dif=Math.min(4,Math.max(1,parseInt(o.dif??o.dificultad)||2));
 let tabla=o.tabla||null;if(tabla&&typeof tabla==='object'&&Array.isArray(tabla.filas))tabla={titulo:String(tabla.titulo||'Datos'),cols:(tabla.cols||[]).map(String),filas:tabla.filas.map(r=>(Array.isArray(r)?r:[r]).map(String))};else tabla=null;
 return {id:hash(asig+'|'+tema+'|'+q),asig,tema,tk:temaKey(tema),dif,q,ops,ok,sol:String(o.sol||o.solucion||''),trap:String(o.trap||''),calc:!!(o.calc??o.calculadora),tabla};
}
function fixBS(t){return t.replace(/(^|[^\\])\\(?=[a-zA-Z]{2,}|[{}()\[\],;!:%| ])/g,'$1\\\\').replace(/(^|[^\\])\\(?=[a-zA-Z]{2,}|[{}()\[\],;!:%| ])/g,'$1\\\\')}
function topArrays(t){const out=[];let depth=0,inS=false,escp=false,start=-1;for(let i=0;i<t.length;i++){const ch=t[i];if(inS){if(escp)escp=false;else if(ch==='\\')escp=true;else if(ch==='"')inS=false;continue}
 if(ch==='"'&&depth>0){inS=true;continue}if(ch==='['){if(depth===0)start=i;depth++}else if(ch===']'&&depth>0){depth--;if(depth===0)out.push(t.slice(start,i+1))}}return out}
function parseImport(txt){
 const t=fixBS(txt.replace(/```(?:json)?/gi,''));const blocks=topArrays(t);if(!blocks.length)throw 'No encuentro ningún bloque [ ... ] de preguntas.';
 let all=[];for(const b of blocks){try{const v=JSON.parse(b);if(Array.isArray(v))all=all.concat(v)}catch(e){}}
 if(!all.length)throw 'El JSON no es válido. Pídele a Gemini que lo repita SOLO como bloque de código JSON.';return all}
function temasOf(a){const m=new Map();S.qs.forEach(q=>{if(q.asig===a&&!m.has(q.tk))m.set(q.tk,q.tema)});return [...m].map(([tk,name])=>({tk,name})).sort((x,y)=>x.tk.localeCompare(y.tk,undefined,{numeric:true}))}
function failPool(){return S.qs.filter(q=>{const s=S.st[q.id];return s&&s.w>0&&(s.l===0||s.w>=s.c)})}
function pickQs(pred,n,difs){const base=S.qs.filter(pred);const qc=S.qc||0,ls=S.ls||{};const w=q=>{const s=S.st[q.id]||{c:0,w:0};const rec=qc-(ls[q.id]??-1e9);return s.c-2*s.w+Math.random()*2+(rec<60?8-rec/10:0)};
 const prim=base.filter(q=>difs.includes(q.dif)).map(q=>[w(q),q]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
 const dist=d=>Math.min(...difs.map(x=>Math.abs(x-d)));
 const sec=shuffle(base.filter(q=>!difs.includes(q.dif))).sort((a,b)=>dist(a.dif)-dist(b.dif));
 let res=prim.concat(sec).slice(0,n);const gc=genCands(pred,difs.length?difs:[1,2,3,4]);if(gc.length){const fresh=base.filter(q=>difs.includes(q.dif)&&(qc-(ls[q.id]??-1e9))>=60).length;const gp=fresh>=n*2?.25:.5;res=res.map(q=>Math.random()<gp?(makeGen(pk(gc))||q):q);while(res.length<n){const g=makeGen(pk(gc));if(!g)break;res.push(g)}}
 return shuffle(res)}

 const s=[0,1,2,3].map(i=>Number.isFinite(given[i])?Math.min(hi,Math.max(lo,given[i])):lo+Math.floor(seed/(7**i))%(hi-lo+1));

function synergies(cs){const out=[],byA={},byR={};cs.forEach(c=>{if(c.a!=='ALL')byA[c.a]=(byA[c.a]||0)+1;byR[c.r]=(byR[c.r]||0)+1});
 Object.entries(byA).forEach(([a,n])=>{if(n>=3)out.push({n:SYN_A[a]+' total',d:`3 cartas de ${ASIG[a].name}: +4 s y +15 % 🪙`,tb:4,cm:.15});else if(n>=2)out.push({n:SYN_A[a],d:`2 cartas de ${ASIG[a].name}: +2 s`,tb:2})});

 cs.forEach(c=>{tb+=Math.max(0,stat(c,0)-50);v+=Math.max(0,stat(c,1)-50);b+=Math.max(0,stat(c,2)-50);r+=Math.max(0,stat(c,3)-50);if(asig&&asig!=='ALL'&&(c.a===asig||c.a==='ALL'))m++});
 const syn=synergies(cs),d={tb:Math.round(tb/10),cm:1+v/200+0.1*m,xm:1+b/200,sh:Math.floor(r/40),icons:cs.filter(c=>c.r==='I'),syn};

function rollChest(){const r=Math.random();return r<.03?'l':r<.15?'g':r<.45?'s':'w'}
const chestLeft=c=>c.end?Math.max(0,c.end-Date.now()):null;
function fmtLeft(ms){const s=Math.ceil(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h} h ${m} min`:m?`${m} min ${String(x).padStart(2,'0')} s`:`${x} s`}
function speedChest(sec){const c=S.chests.find(x=>x.end&&Date.now()<x.end);if(c)c.end-=sec*1000}
function chestTap(i){const c=S.chests[i];if(!c)return;const T=CHESTS[c.t];if(c.end&&Date.now()>=c.end)return openChest(i);
 if(c.end){const left=chestLeft(c),cost=Math.ceil(left/60000)*2;modal(`<div class="cele"><div class="ce">${T.e}</div><h2>${T.n}</h2><div class="mut" style="font-size:15px">Se abre en <b class="cd" data-end="${c.end}">${fmtLeft(left)}</b>.<br>Cada pregunta que aciertes le quita 1 minuto.</div><button class="btn gold" style="margin-top:16px" onclick="openNow(${i})" ${S.coins>=cost?'':'disabled'}>Abrir ya por ${cost} 🪙</button></div>`);return}
 if(S.chests.some(x=>x.end&&Date.now()<x.end)){toast('Ya hay un cofre abriéndose. Acierta preguntas para acelerarlo ⚡');return}
 c.end=Date.now()+T.t*1000;save();toast(`${T.e} Empieza a abrirse: ${fmtLeft(T.t*1000)}`);render()}
function openNow(i){const c=S.chests[i];if(!c||!c.end)return;const cost=Math.ceil(chestLeft(c)/60000)*2;if(S.coins<cost)return;S.coins-=cost;closeModal();openChest(i)}
function openChest(i){const c=S.chests.splice(i,1)[0],T=CHESTS[c.t],coins=T.c[0]+Math.floor(Math.random()*(T.c[1]-T.c[0]+1));S.coins+=coins;S.dust+=T.d;S.chestsOpened=(S.chestsOpened||0)+1;const info=grantCards(T.k,T.kind,T.ic);save();renderTop();showOpening(info,{n:`${T.e} ${T.n} · +${coins} 🪙 · +${T.d} ✨`})}

const PASS_T=30,PASS_P=150;
const passTier=()=>Math.min(PASS_T,Math.floor(S.pass.p/PASS_P));
function passRw(t){return t%10===0?{t:'👑 Sobre ICON',f:()=>S.iconPacks++}:t%5===0?{t:'✨ Sobre Premium',f:()=>S.inv.premium++}:t%3===0?{t:'🧰 Cofre de plata',f:()=>{if(!addChest('s'))S.coins+=200}}:t%2===0?{t:'✨ 80 de polvo',f:()=>S.dust+=80}:{t:`🪙 ${100+t*10} monedas`,f:()=>S.coins+=100+t*10}}
const passClaimable=()=>{const t=passTier();let n=0;for(let i=1;i<=t;i++)if(!S.pass.cl.includes(i))n++;return n};
function claimPass(t){if(t>passTier()||S.pass.cl.includes(t))return;S.pass.cl.push(t);const r=passRw(t);r.f();save();sfx('gold');toast(`🎫 Nivel ${t}: ${r.t}`);if(S.pass.cl.length>=PASS_T)celebrate('🎫','¡Pase completado!','Has conseguido todas las recompensas.');checkAch();render()}
function claimAllPass(){const t=passTier();for(let i=1;i<=t;i++)if(!S.pass.cl.includes(i)){S.pass.cl.push(i);passRw(i).f()}save();sfx('gold');confetti(60);checkAch();render()}

VIEWS.packs=()=>{V.innerHTML=`<h2>🎁 Sobres</h2><div class="card-box"><b>★ Barra de suerte</b><div class="xpbar"><i style="width:${Math.min(100,(S.pity||0)/40*100)}%;background:linear-gradient(90deg,#ff6ad5,#ffe66d)"></i></div><div class="mut">ICON garantizada como mucho en ${Math.max(1,40-(S.pity||0))} sobres o cofres más. Se reinicia al sacar una ICON.</div></div>
 ${S.freeDay!==today()?packTile('free','Sobre gratis de hoy','Gratis','normal','3 cartas · uno al día'):''}

 ${S.inv.themed>0?packTile('invT',`Sobre de Especialidad ×${S.inv.themed}`,'Abrir','themed','Elige la asignatura · 3 cartas'):''}${S.inv.mutation>0?packTile('invM',`Sobre Mutágeno ×${S.inv.mutation}`,'Abrir','mutation','3 cartas + 1 catalizador'):''}

 <div class="card-box"><b>🧬 Catalizadores: ${S.mutagen||0}</b><div class="mut">Combina 1 copia repetida y 1 catalizador para mutar una carta desde su ficha del Álbum. Las mutaciones cambian cómo juega tu mazo en las expediciones.</div><button class="btn sec" onclick="go('lab')">🔬 Proyecto Horizonte</button></div>

function rollR(kind){const o=PACKS[kind].o,b=0.005*leagueIdx(S.trophies),I=o.I+b,r=Math.random();return r<I?'I':r<I+o.O?'O':r<I+o.O+o.P?'P':'B'}
function openPack(type,gift){let kind=type;if(type==='free'){if(S.freeDay===today())return;S.freeDay=today();kind='normal'}else if(type==='icon'){if(S.iconPacks<1)return;S.iconPacks--}else if(type==='invP'){if(S.inv.premium<1)return;S.inv.premium--;kind='premium'}else if(type==='invN'){if(S.inv.normal<1)return;S.inv.normal--;kind='normal'}else if(type==='invT'){if((S.inv.themed||0)<1)return;S.inv.themed--;kind='themed'}else if(type==='invM'){if((S.inv.mutation||0)<1)return;S.inv.mutation--;kind='mutation'}
 else if(!gift){const p=PACKS[type].p;if(S.coins<p){toast('No tienes monedas suficientes 🪙');sfx('bad');return}S.coins-=p}
 const info=grantCards(3,kind,type==='icon',kind==='themed'&&TL_PACK_ASIG!=='ALL'?TL_PACK_ASIG:null);if(kind==='mutation')S.mutagen=(S.mutagen||0)+1;prog('pack',1);save();renderTop();showOpening(info,kind==='mutation'?{n:PACKS[kind].n+' · +1 catalizador'}:PACKS[kind])}
function grantCards(n,kind,forceI,asig){const got=[];const pityHit=!forceI&&(S.pity||0)>=39;for(let i=0;i<n;i++){const r=(forceI||pityHit)&&i===0?'I':rollR(kind);let pool=CARDS.filter(c=>c.r===r&&(!asig||c.a===asig||c.a==='ALL'));if(!pool.length)pool=CARDS.filter(c=>c.r===r);got.push(rnd(pool))}if(pityHit)setTimeout(()=>toast('★ ¡ICON garantizada por la barra de suerte!'),400);S.pity=got.some(c=>c.r==='I')?0:(S.pity||0)+1;got.sort((a,b)=>RORD[a.r]-RORD[b.r]);const shp=kind==='premium'||kind==='themed'?.07:kind==='mutation'?.08:.04;
 const info=got.map(c=>{const had=!!S.cards[c.id];if(had)S.cards[c.id].n++;else S.cards[c.id]={n:1,l:1};const sh=Math.random()<shp;if(sh)S.cards[c.id].sh=1;return {c,isNew:!had,sh}});
 info.forEach(({c})=>{if(S.deck.length<3&&!S.deck.includes(c.id))S.deck.push(c.id)});return info}
function showOpening(info,pk){let rev=0;
 modal(`<h3>${pk.n}</h3><div class="mut">Toca cada carta para darle la vuelta</div><div class="rays" aria-hidden="true"></div><div class="pack-stage">${info.map((x,i)=>`<div class="flip" data-i="${i}"><div class="in"><div class="dorso"><span>📡</span>TL</div><div class="frontc">${cardHTML(x.c)}<span class="newb ${x.sh?'shb':x.isNew?'':'dup'}">${x.sh?'✨ BRILLANTE':x.isNew?'NUEVA':'REPETIDA'}</span></div></div></div>`).join('')}</div><div class="row" style="margin-top:16px"><button class="btn sec" id="op-all">Abrir todas</button><button class="btn" id="op-ok" disabled>Continuar</button></div>`,true);
 const flips=[...$('#modal').querySelectorAll('.flip')];
 const open=el=>{if(el.classList.contains('open'))return;const x=info[+el.dataset.i];el.classList.add('open','g-'+x.c.r);rev++;
  if(x.sh){setTimeout(()=>{toast(`✨ ¡${x.c.n} BRILLANTE! +3 a todo`);confetti(60,['#7cffcb','#94d0ff','#fff','#ffe66d'])},350)}if(x.c.r==='I'){sfx('icon');vib([80,50,80,50,200]);flash();confetti(120,['#ff6ad5','#ffe66d','#7cffcb','#94d0ff','#fff']);setTimeout(()=>toast(`★ ¡ICON! ${x.c.n}`),300)}else if(x.c.r==='O'){sfx('gold');confetti(40,['#fde68a','#fbbf24','#fff'])}else sfx('flip');
  if(rev===info.length)$('#op-ok').disabled=false};
 flips.forEach(el=>el.onclick=()=>open(el));$('#op-all').onclick=()=>flips.forEach((el,i)=>setTimeout(()=>open(el),i*500));$('#op-ok').onclick=()=>{closeModal();render();checkSets();checkAch()};if(info.length===1&&flips[0])setTimeout(()=>open(flips[0]),400)}

const DUST={B:5,P:15,O:40,I:150},CRAFT={B:40,P:100,O:250,I:1000},UPD={B:10,P:25,O:60,I:200},FUS={B:5,P:5,O:6},NEXTR={B:'P',P:'O',O:'I'};
const dupCount=r=>CARDS.filter(c=>c.r===r&&S.cards[c.id]).reduce((x,c)=>x+S.cards[c.id].n-1,0);
function workshop(){const tot=CARDS.filter(c=>S.cards[c.id]).reduce((x,c)=>x+(S.cards[c.id].n-1)*DUST[c.r],0);

 <div class="card-box" style="margin-top:12px"><b>Reciclar repetidas</b><div class="mut">Convierte todas tus repetidas en polvo (te quedas 1 de cada). Bronce ${DUST.B} · Plata ${DUST.P} · Oro ${DUST.O} · ICON ${DUST.I}.</div><button class="btn" style="margin-top:10px" id="ws-rec" ${tot?'':'disabled'}>♻️ Reciclar todo (+${tot} ✨)</button></div>

 $('#ws-rec').onclick=()=>{CARDS.forEach(c=>{const o=S.cards[c.id];if(o&&o.n>1){S.dust+=(o.n-1)*DUST[c.r];o.n=1}});save();sfx('gold');toast(`+${tot} ✨ polvo`);workshop();render()}}
function fuse(r){let need=FUS[r];if(dupCount(r)<need)return;const pool=CARDS.filter(c=>c.r===r&&S.cards[c.id]&&S.cards[c.id].n>1).sort((a,b)=>S.cards[b.id].n-S.cards[a.id].n);
 while(need>0){for(const c of pool){if(need>0&&S.cards[c.id].n>1){S.cards[c.id].n--;need--}}}
 const nr=NEXTR[r],miss=CARDS.filter(c=>c.r===nr&&!S.cards[c.id]),c=rnd(miss.length?miss:CARDS.filter(x=>x.r===nr)),isNew=!S.cards[c.id];if(isNew)S.cards[c.id]={n:1,l:1};else S.cards[c.id].n++;save();renderTop();showOpening([{c,isNew}],{n:'🔮 Fusión'})}

 <div class="card-box" style="margin-top:10px"><b>🎯 Cómo sacarle partido</b><div class="mut">Mejor estadística: <b>${STATN[c.s.indexOf(Math.max(...c.s))]}</b> (${Math.max(...c.s.map((_,k)=>stat(c,k)))}).${(()=>{const pk=PERKS.find(x=>x.g===grpOf(c.a));return pk?` Ventaja de asignatura: ${pk.n}, ${pk.d}.`:''})()} En la Batalla de cartas pega +30 si la pregunta es de su asignatura.</div></div><div class="mut">Nivel ${o.l}/${maxL(o)} · Copias: ${o.n}. Cada nivel suma +2 a cada estadística.</div>
 <div class="card-box" style="margin-top:8px"><b>📈 Experiencia de la carta</b><div class="xpbar"><i style="width:${o.l>=maxL(o)?100:Math.min(100,(o.xp||0)/xpNeed(o.l)*100)}%"></i></div><div class="mut">${o.l>=maxL(o)?(o.aw?'Nivel máximo':'Tope de nivel 5: despiértala para llegar a 10'):`${o.xp||0}/${xpNeed(o.l)} XP para el nivel ${o.l+1}`}. Gana XP en el mazo cuando aciertas: +12 por pregunta de ${c.a==='ALL'?'cualquier asignatura':esc(ASIG[c.a].name)}, +4 por las demás (x2 en la asignatura de la semana).</div></div>
 ${o.aw?'<div class="card-box awbox"><b>⭐ Carta despertada</b><div class="mut">+5 a todo y nivel máximo 10.</div></div>':`<div class="card-box awbox"><b>⭐ Despertar</b><div class="mut">${o.l>=5?'✅':'⬜'} Nivel 5 · ${o.n-1>=AWC[c.r]?'✅':'⬜'} ${AWC[c.r]} repetida${AWC[c.r]>1?'s':''} · ${hasMastIn(c.a)?'✅':'⬜'} Maestría 🥉 en un tema de ${c.a==='ALL'?'cualquier asignatura':esc(ASIG[c.a].name)} · ${200*RM[c.r]} 🪙</div><button class="btn gold" style="margin-top:8px" onclick="awaken('${c.id}')" ${o.l>=5&&o.n-1>=AWC[c.r]&&hasMastIn(c.a)&&S.coins>=200*RM[c.r]?'':'disabled'}>⭐ Despertar: +5 a todo y nivel máx. 10</button></div>`}
 <button class="btn ${inDeck?'sec':''}" style="margin-top:12px" id="cd-deck">${inDeck?'Quitar del mazo':'Añadir al mazo'}</button>

 <div class="row" style="margin-top:10px"><button class="btn sec" id="cd-sell" ${extra>0?'':'disabled'}>Vender rep. +${SELL[c.r]} 🪙</button><button class="btn sec" id="cd-rec" ${extra>0?'':'disabled'}>♻️ Reciclar rep. +${DUST[c.r]} ✨</button></div>${c.custom?'':''}`);
 $('#cd-upd').onclick=()=>{const k=UPD[c.r]*o.l;if(o.l>=maxL(o)||S.dust<k)return;S.dust-=k;o.l++;save();sfx('lvl');confetti(40);cardDetail(id);render()};

function doImport(){const t=$('#imp-t').value,r=$('#imp-r');if(!t.trim()){r.innerHTML='<div class="err">Pega primero el texto.</div>';return}
 let arr;try{arr=parseImport(t)}catch(e){r.innerHTML=`<div class="err">❌ ${esc(e)}</div>`;return}
 let add=0,upd=0,cAdd=0,cUpd=0;const bad=[],per={};
 arr.forEach((o,i)=>{try{if(isCardObj(o)){addCard(normCard(o))?cAdd++:cUpd++;return}const q=normQ(o),k=S.qs.findIndex(x=>x.id===q.id);if(k>=0){S.qs[k]=q;upd++}else{S.qs.push(q);add++}const key=ASIG[q.asig].name+' · '+q.tema;per[key]=(per[key]||0)+1}catch(e){bad.push(`#${i+1}: ${e}`)}});
 save();r.innerHTML=`${cAdd+cUpd?`<div class="okb">🃏 ${cAdd} cartas nuevas${cUpd?`, ${cUpd} actualizadas`:''}. Ya pueden salir en los sobres.</div>`:''}${add+upd?`<div class="okb">✅ ${add} preguntas nuevas${upd?`, ${upd} actualizadas`:''}<br>${Object.entries(per).map(([k,v])=>`${esc(k)}: ${v}`).join('<br>')}</div>`:''}${bad.length?`<div class="err">⚠️ ${bad.length} descartadas:<br>${bad.slice(0,10).map(esc).join('<br>')}</div>`:''}`;
 if(add||cAdd){$('#imp-t').value='';sfx('ok');confetti(40)}const m=$('#mng');if(m)m.outerHTML=manageHTML()}
function manageHTML(){const rows=ASIGS.map(a=>{const t=temasOf(a.id);if(!t.length)return '';return `<div class="card-box"><b>${a.icon} ${esc(a.name)}</b>${t.map(x=>`<div class="mrow"><span>${esc(x.name)} · ${S.qs.filter(q=>q.asig===a.id&&q.tk===x.tk).length}</span><button class="del" onclick="delTema(this,'${a.id}','${jsq(x.tk)}')">Borrar</button></div>`).join('')}</div>`}).join('');
 const cs=(S.custom||[]);const cards=cs.length?`<div class="card-box"><b>✏️ Cartas creadas (${cs.length})</b>${cs.map(c=>`<div class="mrow"><span>${esc(c.e)} ${esc(c.n)} · ${RN[c.r]} · ${c.a==='ALL'?'Todas':esc(ASIG[c.a].name)}</span><button class="del" onclick="delCard(this,'${c.id}')">Borrar</button></div>`).join('')}</div>`:'';
 return `<div id="mng">${rows||'<div class="mut">No hay preguntas todavía.</div>'}${cards}</div>`}
function delTema(btn,a,tk){if(!btn.dataset.c){btn.dataset.c=1;btn.textContent='¿Seguro?';return}S.qs=S.qs.filter(q=>!(q.asig===a&&q.tk===tk));save();const m=$('#mng');if(m)m.outerHTML=manageHTML();toast('Tema borrado')}

function dist(n){return n>=25?[8,8,6,3]:n>=15?[5,5,3,2]:[3,3,3,1]}
function genCardPrompt(){const a=ASIG[PG.asig],n=PG.n,have=CARDS.filter(c=>c.a===a.id).map(c=>c.n);
return `Lee el contenido de mi carpeta "${a.folder}" (${a.full}) de Drive y crea ${n} cartas coleccionables para mi juego de estudio, sobre los conceptos, componentes, técnicas, teoremas y personajes históricos que aparecen en mis apuntes.

REGLAS
- Solo conceptos que aparezcan en mis PDF de esta asignatura.
- Rarezas: Bronce (elementos y conceptos básicos), Plata (técnicas y métodos), Oro (teoremas y conceptos clave) e Icon (personajes históricos relacionados con la asignatura; como mucho 2).
- Reparto aproximado: 40 % Bronce, 30 % Plata, 20 % Oro y 10 % Icon.
- "texto": 1–2 frases sobre el concepto, con su fórmula clave en LaTeX entre $...$ (con las barras dobles: $\\\\frac{a}{b}$). En los Icon, qué aportaron.
- "emoji": un emoji que lo represente.
- "habilidad": solo en los Icon, una de estas: 50/50, congelar, x2, escudo, cambiar, monedas. En las demás, null.
${have.length?`- No repitas estas cartas, que ya existen: ${have.join(', ')}.\n`:''}
FORMATO: responde SOLO con un bloque de código JSON, sin texto antes ni después:
[
{"tipo":"carta","asig":"${a.id}","nombre":"...","emoji":"💡","rareza":"Plata","texto":"...","habilidad":null},
{"tipo":"carta","asig":"${a.id}","nombre":"...","emoji":"🧠","rareza":"Icon","texto":"...","habilidad":"congelar"}
]`}
function genPrompt(){if(PG.mode==='c')return genCardPrompt();const a=ASIG[PG.asig],tema=PG.tema.trim()||'T1 [nombre del tema]',n=PG.n,d=dist(n);
return `Lee a fondo el contenido de este tema de mi Drive (apuntes, relación de ejercicios y soluciones, si las hay) y genera preguntas para mi juego de estudio.

ASIGNATURA: ${a.id} (${a.full}, carpeta "${a.folder}")
TEMA: ${tema}
${PG.files.trim()?`ARCHIVOS: ${PG.files.trim()}\n`:''}CANTIDAD: ${n} preguntas

REGLAS
- Solo contenido de ese tema, con la misma notación y las mismas fórmulas que mis PDF. Nada de otros temas ni asignaturas.
- Reparto: ${d[0]} de dificultad 1 (conceptos), ${d[1]} de dificultad 2 (fórmulas directas), ${d[2]} de dificultad 3 (como los ejercicios de la relación, con otros números) y ${d[3]} de dificultad 4 (tipo examen).
- 4 opciones (o 2 si es Verdadero/Falso). Las incorrectas, del mismo tema y basadas en errores típicos. Solo una correcta.
- Comprueba cada cálculo dos veces con el método de los solucionarios.
- "ok" = posición de la opción correcta, empezando en 0.
- "sol" = solución corta paso a paso.
- "calc" = true si hace falta calculadora.
- "tabla" = si la pregunta necesita datos en forma de tabla, ponlos con el formato del ejemplo; si no, null. Si hace falta un valor de una tabla del PDF (Erlang, transformadas...), dalo en el enunciado.
- Fórmulas en LaTeX entre $...$, con las barras dobles: $\\\\frac{L}{R}$.
- Si hay código, ponlo entre \`\`\` dentro del texto, con \\n para los saltos de línea.
- Usa EXACTAMENTE "asig":"${a.id}" y "tema":"${tema}" en todas.

FORMATO: responde SOLO con un bloque de código JSON, sin texto antes ni después:
[
{"asig":"${a.id}","tema":"${tema}","dif":2,"q":"Enunciado...","ops":["correcta","incorrecta","incorrecta","incorrecta"],"ok":0,"sol":"$t_{tx}=\\\\frac{L}{R}=...$","calc":true,"tabla":null},
{"asig":"${a.id}","tema":"${tema}","dif":3,"q":"Con los datos de la tabla...","ops":["...","...","...","..."],"ok":2,"sol":"...","calc":true,"tabla":{"titulo":"Datos","cols":["Tramo","d (km)","R"],"filas":[["A-B","300","10 Mbps"],["B-C","30","1 Mbps"]]}}
]`}
function updPrompt(){const o=$('#pg-out');if(o)o.value=genPrompt()}
function copyPrompt(){const o=$('#pg-out');copyText(o.value,o)}
function copyText(t,el){const ok=()=>toast('Copiado ✅');try{navigator.clipboard.writeText(t).then(ok).catch(()=>fallback())}catch(e){fallback()}
 function fallback(){try{el.removeAttribute('readonly');el.select();document.execCommand('copy');el.setAttribute('readonly','');ok()}catch(e){toast('Selecciona el texto y cópialo a mano')}}}

function erlangB(c,I){let b=1;for(let n=1;n<=c;n++)b=I*b/(n+I*b);return b}
function erlangC(c,I){if(I>=c)return 1;const b=erlangB(c,I);return c*b/(c-I*(1-b))}
function erlangI(c,B){let lo=0,hi=c*4+20;for(let k=0;k<60;k++){const m=(lo+hi)/2;if(erlangB(c,m)<B)lo=m;else hi=m}return (lo+hi)/2}
const T=(titulo,cols,filas)=>tableHTML({titulo,cols,filas});
VIEWS.tables=()=>{const own={};S.qs.forEach(q=>{if(q.tabla){const k=q.asig+'|'+q.tabla.titulo+'|'+JSON.stringify(q.tabla.filas);own[k]={a:q.asig,t:q.tabla}}});const ownL=Object.values(own);
