 <details class="card-box"><summary><b>📋 Tabla Erlang-B</b> · tráfico I (E) según c y bloqueo</summary><div style="margin-top:10px">${T('Erlang-B: I ofrecido',['c','1 %','2 %','5 %','10 %'],Array.from({length:20},(_,i)=>[String(i+1),...[.01,.02,.05,.1].map(B=>erlangI(i+1,B).toFixed(2))]))}</div><div class="mut">Calculada con la fórmula exacta. Si tus apuntes usan otra tabla, manda la suya.</div></details>
 <details class="card-box"><summary><b>🏗️ Jerarquías PDH y SDH</b></summary><div style="margin-top:10px">${T('PDH (europea)',['Nivel','R'],[['E1','2,048 Mbps (30 canales de 64 kbps)'],['E2','8,448 Mbps'],['E3','34,368 Mbps'],['E4','139,264 Mbps']])}${T('SDH',['Nivel','R'],[['STM-1','155,52 Mbps'],['STM-4','622,08 Mbps'],['STM-16','2 488,32 Mbps'],['STM-64','9 953,28 Mbps']])}</div></details>
 <details class="card-box"><summary><b>📻 Bandas del espectro</b></summary><div style="margin-top:10px">${T('Bandas (UIT)',['Banda','Rango','Propagación','Usos'],[['MF','300 kHz – 3 MHz','Onda de superficie','Radio AM'],['HF','3 – 30 MHz','Ionosférica','Onda corta, marítimo'],['VHF','30 – 300 MHz','Espacial (LOS)','Radio FM'],['UHF','300 MHz – 3 GHz','Espacial (LOS)','TDT, móviles, WiFi 2,4 GHz'],['SHF','3 – 30 GHz','Espacial (LOS)','Radioenlaces, satélite, WiFi 5 GHz'],['EHF','30 – 300 GHz','LOS (mucha atenuación)','Milimétricas, 5G mmWave']])}</div></details>
 <details class="card-box"><summary><b>〽️ Códigos de línea</b></summary><div style="margin-top:10px">${T('Códigos de línea',['Código','Componente continua','Autosincronizado','1er nulo'],[['NRZ unipolar','Sí','No','R'],['NRZ polar','Sí (si no está equilibrado)','No','R'],['RZ unipolar','Sí','Parcial','2R'],['AMI (bipolar)','No','No (salvo rachas de 1)','R'],['Manchester','No','Sí','2R']])}</div></details>
 <details class="card-box"><summary><b>💥 Acceso al medio</b></summary><div style="margin-top:10px">${T('Técnicas',['Técnica','Throughput','Vulnerable'],[['ALOHA puro','$S=Ge^{-2G}$, máx. 0,184 en G=0,5','$2t_{tx}$'],['ALOHA ranurado','$S=Ge^{-G}$, máx. 0,368 en G=1','$t_{tx}$'],['CSMA','—','$t_{prop}$'],['CSMA/CD','Detecta si $t_{tx}>2t_{prop}$','—'],['Sondeo','$S_{max}=\\frac{t_{tx}}{t_{tx}+\\tau}$','—'],['Reserva','$S_{max}=\\frac{t_{tx}}{t_{tx}+t_{mr}}$','—']])}<div class="mut">Ethernet a 10 Mbps: $L_{min}=64$ B $=512$ bits. Fórmulas sacadas del índice de tus apuntes: compruébalas con las transparencias.</div></div></details>
 <details class="card-box"><summary><b>🧮 Colas M/M/1</b></summary><div class="sol">$\\rho=\\frac{\\lambda}{\\mu}$   $N=\\frac{\\rho}{1-\\rho}$   $Q=\\frac{\\rho^2}{1-\\rho}$\n$T=\\frac{1}{\\mu-\\lambda}$   $W=\\frac{\\rho}{\\mu-\\lambda}$\nLittle: $N=\\lambda T$, $Q=\\lambda W$</div></details>
 ${ownL.length?`<h3>Tablas de tus preguntas</h3>${ownL.map(x=>`<div class="mut">${ASIG[x.a].icon} ${esc(ASIG[x.a].name)}</div>${tableHTML(x.t)}`).join('')}`:''}`;erCalc()};
function erCalc(){const c=parseInt($('#er-c')?.value),I=parseFloat($('#er-i')?.value),r=$('#er-r');if(!r)return;if(!(c>0)||!(I>=0)){r.textContent='Introduce c ≥ 1 e I ≥ 0';return}
 const b=erlangB(c,I);r.textContent=`E_B(${c}; ${I}) = ${b.toFixed(4)}\n`+(I<c?`E_C(${c}; ${I}) = ${erlangC(c,I).toFixed(4)}\nρ = I/c = ${(I/c).toFixed(3)}`:'E_C: el sistema con cola es inestable (I ≥ c)')}

/* =====================================================================
   v5 · 1) GENERADORES PROCEDURALES CON VARIACIÓN ESTRUCTURAL
   Cada generador elige escenario + magnitud pedida + unidad + trampa.
   mk() monta 4 opciones a partir de errores típicos (con su explicación)
   y validGen() rechaza cualquier pregunta imposible antes de mostrarla.
   ===================================================================== */
const NOPOS={allowNeg:1};
/* opciones: valor correcto + distractores [valor, motivo del error] */
function mk(cv,ds,F,opt={}){const ops=[F(cv)],why=[];for(const [v,m] of ds){if(v==null)continue;if(typeof v==='number'&&(!isFinite(v)||(!opt.allowNeg&&v<=0)))continue;const f=F(v);if(!f||ops.includes(f))continue;ops.push(f);why.push(`«${f}»: ${m}`);if(ops.length===4)break}return {ops,why}}
const whyTxt=w=>w.length?'\n\n🔎 Por qué no las otras:\n• '+w.join('\n• '):'';
/* unidad de tiempo adaptada a la magnitud (s, ms o µs) */
function tUnit(v){return v>=1?[1,'s']:v>=1e-3?[1e3,'ms']:[1e6,'µs']}

function fixMathSeg(b){const keep=[];const prot=x=>{keep.push(x);return '\u0001'+(keep.length-1)+'\u0002'};
 b=b.replace(/\\\{[^{}]*\\\}/g,prot).replace(/\(\s*-?\d+(?:\s*,\s*-?\d+)+\s*\)(?!\s*\^)/g,prot).replace(/\[\s*-?\d+(?:\s*,\s*-?\d+)+\s*\]/g,prot);
 b=b.replace(/(\d),(\d)/g,'$1{,}$2').replace(/\+\s*-/g,'-').replace(/-\s*-(?=\s*\d)/g,'+').replace(/-\s*\+/g,'-');
 return b.replace(/\u0001(\d+)\u0002/g,(_,i)=>keep[+i])}
function mathFix(s){return String(s).replace(/\$\$([^$]+)\$\$|\$([^$]+)\$/g,(m,a,b)=>a!=null?'$$'+fixMathSeg(a)+'$$':'$'+fixMathSeg(b)+'$')}

const frTex=(p,q)=>{if(q<0){p=-p;q=-q}const g=gcd(Math.abs(p),q)||1;p/=g;q/=g;return q===1?String(p):(p<0?'-':'')+`\\frac{${Math.abs(p)}}{${q}}`};

 {asig:'RST1',tema:'T5 Dimensionado de redes',dif:3,q:'Una central ofrece 12 Erlangs y tiene 15 circuitos. Si Erlang-B=0,10, ¿cuál es el tráfico cursado?',ops:['10,8 Erlangs','1,2 Erlangs','12 Erlangs','13,2 Erlangs'],calc:true,sol:'El tráfico cursado es I(1−B)=12·0,90=10,8 Erlangs.',trap:'Informar el tráfico bloqueado (1,2 E) en lugar del cursado.'},
 {asig:'RST2',tema:'T1 Intercambio de datos (errores y flujo)',dif:3,q:'Una trama de 1200 bytes se envía por un enlace de 6 Mbit/s. Sin ACK ni propagación, ¿cuánto dura su transmisión?',ops:['1,6 ms','0,2 ms','7,2 ms','0,16 ms'],calc:true,sol:'1200·8=9600 bits; 9600/(6·10⁶)=0,0016 s = 1,6 ms.',trap:'Dividir bytes por una tasa en bits/s sin convertir unidades.'},
 {asig:'RST2',tema:'T1 Intercambio de datos (errores y flujo)',dif:3,q:'Con números de secuencia de 4 bits, ¿cuál es la ventana máxima de Go-Back-N?',ops:['15 tramas','16 tramas','8 tramas','4 tramas'],calc:true,sol:'Go-Back-N limita N≤2^k−1: 2⁴−1=15.',trap:'Usar la restricción de repetición selectiva, que es distinta.'},
 {asig:'RST2',tema:'T2 Encaminamiento',dif:2,q:'Una ruta tiene coste 4 hasta A y 7 desde A hasta destino. Otra tiene coste 6 hasta B y 3 desde B. ¿Qué ruta elige un algoritmo de coste mínimo?',ops:['La ruta por A: coste 11','La ruta por B: coste 9','La ruta por A: coste 4','Son iguales'],calc:true,sol:'Compara el coste extremo a extremo: por A es 4+7=11; por B es 6+3=9. Se elige B.',trap:'Comparar solo el coste del primer enlace.'},
 {asig:'RST2',tema:'T2 Encaminamiento',dif:3,q:'Un router tiene una ruta /16 y otra /24 que coinciden con la dirección destino. ¿Cuál aplica?',ops:['La /24, por ser el prefijo más específico','La /16, por ser la red más grande','La ruta con menor dirección IP','Ambas se alternan'],sol:'El reenvío IP usa el prefijo coincidente más largo; /24 aporta más bits de red que /16.',trap:'Elegir por el tamaño numérico del bloque o por el orden de la tabla.'},
 {asig:'RST2',tema:'T3 Modelos de referencia',dif:2,q:'¿Qué función corresponde a la capa de transporte en la pila TCP/IP?',ops:['Comunicación extremo a extremo mediante TCP o UDP','Encaminamiento entre redes IP','Transmisión de símbolos por el medio físico','Resolución de direcciones MAC en el enlace'],sol:'Transporte ofrece comunicación entre procesos y puede multiplexar mediante puertos; TCP y UDP operan aquí.',trap:'Confundir encaminamiento IP (capa de Internet) con transporte extremo a extremo.'},
 {asig:'RST2',tema:'T4 Redes de telecomunicación',dif:2,q:'Un switch Ethernet recibe una trama unicast cuyo destino no aparece en su tabla MAC. ¿Qué hace normalmente?',ops:['Inunda por los demás puertos de la VLAN','La descarta siempre','La envía solo al puerto de entrada','La convierte en una trama broadcast'],sol:'Un destino unicast desconocido se inunda por los puertos de la misma VLAN, salvo el de entrada.',trap:'Confundir un unicast desconocido con un destino conocido en otro puerto.'},
 {asig:'ED1',tema:'T1 Diseño lógico y VHDL',dif:2,q:'En VHDL, un proceso combinacional omite una asignación de salida en una rama de un if. ¿Qué problema puede inferirse?',ops:['Se infiere un latch para conservar el valor','Se genera automáticamente un flip-flop D','La salida pasa siempre a cero','El proceso deja de compilar necesariamente'],sol:'Si una salida debe conservar su valor en una rama, se infiere almacenamiento sensible al nivel: normalmente un latch.',trap:'Suponer que una asignación omitida equivale automáticamente a asignar cero.'},
 {asig:'ED1',tema:'T2 Circuitos combinacionales',dif:2,q:'Simplifica F = A·B + A·¬B.',ops:['A','B','A+B','0'],sol:'Factoriza A: F=A(B+¬B)=A·1=A.',trap:'Aplicar mal el complemento o creer que los dos productos se anulan.'},
 {asig:'ED1',tema:'T3 Circuitos secuenciales',dif:3,q:'Un registro tiene t_co=2 ns, t_comb=17 ns y t_su=3 ns. Ignorando skew, ¿cuál es el periodo mínimo?',ops:['22 ns','20 ns','19 ns','17 ns'],calc:true,sol:'La restricción de setup es T_clk ≥ t_co+t_comb+t_su = 2+17+3 = 22 ns.',trap:'Omitir t_co o t_su al sumar el camino crítico.'},
 {asig:'ED1',tema:'T3 Circuitos secuenciales',dif:2,q:'¿Qué síntoma describe mejor una violación de hold?',ops:['La entrada cambia demasiado pronto después del flanco activo','La entrada se estabiliza demasiado tarde antes del flanco','El reloj tiene una frecuencia demasiado baja','La salida combinacional no tiene inversores'],sol:'Hold exige mantener estable la entrada durante un tiempo mínimo después del flanco.',trap:'Intercambiar las ventanas temporales de hold y setup.'},
 {asig:'ED2',tema:'T1 Características de los CI',dif:2,q:'Un CI consume 1,5 W y tiene θ_ja=40 °C/W a T_a=30 °C. ¿Cuál es T_j estimada?',ops:['90 °C','60 °C','70 °C','45 °C'],calc:true,sol:'T_j=T_a+P·θ_ja=30+1,5·40=90 °C.',trap:'Calcular solo la elevación de temperatura (60 °C) y olvidar sumar T_a.'},
 {asig:'ED2',tema:'T2 Familias lógicas',dif:3,q:'Una salida garantiza V_OH(min)=4,4 V y la entrada requiere V_IH(min)=3,5 V. ¿Cuál es el margen de ruido alto?',ops:['0,9 V','7,9 V','−0,9 V','3,5 V'],calc:true,sol:'NM_H=V_OH(min)−V_IH(min)=4,4−3,5=0,9 V.',trap:'Restar en el orden inverso o sumar tensiones.'},
 {asig:'ED2',tema:'T3 Memorias, osciladores y reloj',dif:2,q:'Una memoria tiene 4096 palabras de 16 bits. ¿Cuántas líneas de dirección y cuántas de datos necesita?',ops:['12 de dirección y 16 de datos','16 de dirección y 12 de datos','4096 de dirección y 16 de datos','12 de dirección y 4096 de datos'],calc:true,sol:'4096=2¹², por tanto hay 12 líneas de dirección; cada palabra de 16 bits requiere 16 líneas de datos.',trap:'Confundir el número de direcciones con el ancho de palabra.'},
 {asig:'ED2',tema:'T4 Máquinas ASM',dif:2,q:'En una máquina de Moore, ¿de qué depende directamente la salida?',ops:['Del estado actual','Del estado actual y de las entradas instantáneas','Solo del reloj futuro','Del estado siguiente exclusivamente'],sol:'En Moore la salida es función del estado; en Mealy depende del estado y de las entradas.',trap:'Atribuir a Moore la dependencia combinacional de entradas propia de Mealy.'},
 {asig:'ED2',tema:'T5 ASM como controlador',dif:3,q:'Un controlador necesita emitir una señal durante un ciclo al detectar una entrada. ¿Qué detalle evita que la señal quede activa por omisión en otros caminos?',ops:['Asignar un valor por defecto inactivo en la lógica de control','Eliminar todos los estados de espera','Usar una señal de reloj asíncrona','Aumentar el ancho del bus de datos'],sol:'Los valores por defecto completos evitan retenciones no deseadas y hacen explícito cuándo se activa la salida.',trap:'Dejar una salida sin asignar en alguna rama y provocar almacenamiento accidental.'},
 {asig:'ED2',tema:'T6 Microprocesadores',dif:2,q:'¿Qué ocurre normalmente en una llamada a subrutina que debe poder retornar?',ops:['Se guarda una dirección de retorno','Se borra el contador de programa','Se reinicia la memoria de datos','Se deshabilitan todas las interrupciones permanentemente'],sol:'La dirección de retorno se conserva —a menudo en la pila o un registro de enlace— para continuar después de la llamada.',trap:'Confundir la dirección de la instrucción llamada con la dirección de retorno.'},
 {asig:'SYS',tema:'T1 Señales y sistemas',dif:2,q:'¿Qué señal tiene energía finita y potencia media nula, según la clasificación habitual?',ops:['Una señal de energía no nula','Una señal periódica no nula','Una señal constante no nula','Toda señal de potencia'],sol:'Una señal de energía tiene 0<E<∞; al promediar esa energía en un intervalo temporal infinito, su potencia media es cero.',trap:'Confundir energía finita con potencia media finita no nula.'},
 {asig:'SYS',tema:'T2 Sistemas LTI',dif:2,q:'Un sistema LTI tiene h[n]=δ[n−2]. ¿Qué salida produce ante x[n]?',ops:['y[n]=x[n−2]','y[n]=x[n+2]','y[n]=2x[n]','y[n]=δ[n−2]'],sol:'La convolución con un impulso desplazado reproduce la señal con el mismo desplazamiento: x[n]*δ[n−2]=x[n−2].',trap:'Cambiar el signo del desplazamiento o confundir retardo con adelanto.'},
 {asig:'SYS',tema:'T3 Análisis de Fourier',dif:3,q:'Una señal real tiene espectro X(f). ¿Qué simetría cumple su transformada de Fourier?',ops:['X(−f)=X*(f)','X(−f)=−X(f) siempre','X(f)=0 para f<0','X(−f)=X(f) siempre'],sol:'La transformada de una señal real tiene simetría hermítica: X(−f)=X*(f). La magnitud es par y la fase, impar bajo las condiciones usuales.',trap:'Afirmar que X(f) es siempre real y par; eso solo vale con simetría adicional.'},
 {asig:'SYS',tema:'T4 Transformadas de Laplace y Z',dif:3,q:'Para un sistema racional causal discreto, ¿qué condición de polos garantiza estabilidad BIBO?',ops:['Todos los polos están estrictamente dentro del círculo unidad','Todos los polos están fuera del círculo unidad','La ROC incluye z=0 exclusivamente','El numerador tiene grado mayor que el denominador'],sol:'En un sistema causal, la ROC queda fuera del polo de mayor módulo; para incluir el círculo unidad y ser estable, todos los polos deben quedar dentro de él.',trap:'Evaluar solo si el polo es real o ignorar la región de convergencia.'},
 {asig:'SYS',tema:'T5 Muestreo',dif:2,q:'Una señal está limitada a 3,4 kHz. ¿Cuál es la frecuencia de muestreo mínima teórica de Nyquist?',ops:['6,8 kHz','3,4 kHz','1,7 kHz','13,6 kHz'],calc:true,sol:'f_s≥2f_max=2·3,4=6,8 kHz. En sistemas reales suele dejarse margen para el filtro antialiasing.',trap:'Usar f_max en lugar de duplicarla.'},
 {asig:'MAT3',tema:'T1 Aritmética entera y modular',dif:2,q:'¿Cuál es el inverso de 3 módulo 11?',ops:['4','3','8','−4'],calc:true,sol:'3·4=12≡1 (mod 11), así que 4 es el inverso.',trap:'Confundir el inverso multiplicativo con el opuesto aditivo, que sería 8.'},
 {asig:'MAT3',tema:'T2 Sistemas de ecuaciones lineales',dif:2,q:'Una matriz escalonada tiene 3 incógnitas y rango 2; el sistema es compatible. ¿Cuántos parámetros libres tiene?',ops:['1','2','3','0'],calc:true,sol:'La dimensión del conjunto solución es n−rango=3−2=1.',trap:'Confundir rango con número de parámetros libres.'},
 {asig:'MAT3',tema:'T3 Espacios vectoriales',dif:2,q:'En R³ hay cuatro vectores. ¿Qué se puede concluir sin conocer sus coordenadas?',ops:['Son linealmente dependientes','Forman siempre una base de R³','Son ortogonales','Generan necesariamente un subespacio de dimensión 4'],sol:'En dimensión 3, cualquier conjunto con más de 3 vectores es linealmente dependiente.',trap:'Suponer que más vectores garantizan más dimensión que la del espacio.'},
 {asig:'MAT3',tema:'T4 Aplicaciones lineales',dif:2,q:'Una aplicación lineal f:R⁵→R³ tiene rango 2. ¿Cuál es la dimensión de su núcleo?',ops:['3','2','5','1'],calc:true,sol:'Teorema rango-nulidad: dim(ker f)+dim(im f)=5; luego dim(ker f)=5−2=3.',trap:'Restar la dimensión del codominio en vez de la del dominio.'},
 {asig:'MAT3',tema:'T5 Diagonalización',dif:3,q:'Una matriz 2×2 tiene dos valores propios distintos. ¿Es necesariamente diagonalizable sobre el mismo cuerpo?',ops:['Sí, tiene dos vectores propios linealmente independientes','No, necesita ser simétrica','Solo si su determinante es 1','Solo si todos sus elementos son positivos'],sol:'Los vectores propios asociados a valores propios distintos son linealmente independientes; en dimensión 2 forman una base.',trap:'Confundir diagonalización con ortogonal diagonalización, que sí exige condiciones adicionales.'},
 {asig:'MAT3',tema:'T6 Espacios euclídeos',dif:2,q:'Dados u=(1,2,0) y v=(2,−1,3), calcula u·v y su relación geométrica.',ops:['0; son ortogonales','5; son paralelos','−2; son ortogonales','3; son linealmente dependientes'],calc:true,sol:'u·v=1·2+2·(−1)+0·3=0; por definición son ortogonales.',trap:'Comprobar si sus coordenadas son proporcionales en vez de calcular el producto escalar.'},
 {asig:'PROG2',tema:'T1 Ficheros',dif:3,q:'En C++, ¿por qué conviene comprobar el estado de un flujo después de leer un número?',ops:['Para detectar fin de archivo o un dato con formato inválido','Para liberar automáticamente todos los punteros','Para ordenar el contenido del fichero','Para reiniciar el contador de programa'],sol:'La extracción del flujo puede fallar tanto al llegar al fin como ante una entrada que no cumple el formato esperado.',trap:'Usar eof() antes de intentar leer: el indicador puede activarse solo tras una lectura fallida.'},
 {asig:'PROG2',tema:'T2 TAD y modularidad',dif:2,q:'¿Qué propiedad ofrece la encapsulación de un TAD?',ops:['Oculta la representación y expone operaciones definidas','Obliga a almacenar los datos en un vector','Hace todas las operaciones O(1)','Evita que exista estado interno'],sol:'Un TAD separa qué operaciones ofrece de cómo se representan internamente sus datos.',trap:'Confundir abstracción de interfaz con una garantía de complejidad.'},
 {asig:'PROG2',tema:'T3 Memoria dinámica',dif:3,q:'¿Qué riesgo tiene ejecutar delete dos veces sobre el mismo puntero no nulo?',ops:['Comportamiento indefinido','Una fuga de memoria corregida automáticamente','Se libera dos veces de forma segura','El objeto se copia antes de liberarse'],sol:'Tras delete, el puntero queda colgante; volver a liberarlo provoca comportamiento indefinido. Un unique_ptr ayuda a expresar propiedad única.',trap:'Creer que delete asigna nullptr al puntero automáticamente.'},
 {asig:'PROG2',tema:'T4 Programación genérica y STL',dif:2,q:'¿Qué requisito debe cumplir el comparador de std::sort para ordenar correctamente?',ops:['Inducir un orden estricto débil','Ser verdadero para comparar cualquier elemento consigo mismo','Cambiar los elementos originales durante la comparación','Devolver siempre el mismo valor'],sol:'std::sort requiere un comparador que satisfaga strict weak ordering; en particular, comp(x,x) debe ser falso.',trap:'Usar <= en vez de < y violar la irreflexividad del comparador.'},
 {asig:'PROG2',tema:'T5 Colecciones',dif:2,q:'Se insertan 4 elementos en una cola FIFO y se ejecutan dos pop. ¿Qué elemento queda al frente?',ops:['El tercero insertado','El último insertado','El segundo insertado','El primero insertado'],sol:'FIFO elimina primero los elementos más antiguos; tras dos pop, el tercero queda al frente.',trap:'Aplicar el comportamiento LIFO de una pila.'}

function tlNumOps(ans,candidates,unit,digits=2){const f=x=>`${nf(x,digits)} ${unit}`,out=[];[ans,...candidates].forEach(x=>{if(Number.isFinite(x)){const v=f(x);if(!out.includes(v)&&out.length<4)out.push(v)}});for(let i=1;out.length<4;i++){const v=f(ans+i*Math.max(.1,Math.abs(ans)*.17));if(!out.includes(v))out.push(v)}return out}

function calcGcd(a,b){a=a<0n?-a:a;b=b<0n?-b:b;while(b){const r=a%b;a=b;b=r}return a||1n}

TL_investmentStyle.textContent=`
.tl-ops-card{--ops-accent:#38bdf8;position:relative;display:block;width:100%;overflow:hidden;margin:0 0 14px;padding:0;text-align:left;color:#f8fbff;border:1px solid #38bdf866;border-radius:22px;background:radial-gradient(ellipse at 82% 18%,#1c4963 0%,transparent 42%),linear-gradient(125deg,#0b1729 0%,#101b31 55%,#111827 100%);box-shadow:0 12px 30px #02061799,inset 0 1px #ffffff12;cursor:pointer;isolation:isolate;transition:transform .18s,border-color .18s,box-shadow .18s}
.tl-ops-card::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.22;background-image:linear-gradient(#38bdf81c 1px,transparent 1px),linear-gradient(90deg,#38bdf81c 1px,transparent 1px);background-size:22px 22px;mask-image:linear-gradient(100deg,#000 0%,transparent 85%)}
.tl-ops-card::after{content:"";position:absolute;right:35px;top:-95px;z-index:-1;width:210px;height:210px;border:1px solid #67e8f933;border-radius:50%;box-shadow:0 0 0 20px #38bdf80a,0 0 0 42px #38bdf807;pointer-events:none}
.tl-ops-card:hover{transform:translateY(-2px);border-color:#67e8f8aa;box-shadow:0 16px 38px #020617bb,inset 0 1px #ffffff18}
.tl-ops-card:focus-visible{outline:3px solid #67e8f8;outline-offset:3px}
.tl-ops-card.daily{--ops-accent:#c4b5fd;background:radial-gradient(ellipse at 82% 18%,#49316d 0%,transparent 42%),linear-gradient(125deg,#111126,#17172f 60%,#111827)}
.tl-ops-card.study{--ops-accent:#fbbf24;background:radial-gradient(ellipse at 82% 18%,#59471b 0%,transparent 42%),linear-gradient(125deg,#171626,#202033 60%,#111827)}
.tl-ops-top{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 92px;align-items:center;gap:8px;padding:17px 17px 12px}
.tl-ops-copy{min-width:0}
.tl-ops-kicker{display:flex;align-items:center;gap:7px;margin-bottom:7px;color:var(--ops-accent);font-size:10px;font-weight:800;letter-spacing:1.45px}
.tl-ops-kicker i{width:7px;height:7px;border-radius:50%;background:var(--ops-accent);box-shadow:0 0 12px var(--ops-accent);animation:tlPulse 1.8s ease-in-out infinite}
.tl-ops-card h2{margin:0 0 6px;font-size:21px;letter-spacing:-.3px}
.tl-ops-card p{max-width:330px;margin:0;color:#b8c5d8;font-size:12px;line-height:1.5}
.tl-ops-orbit{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;justify-self:end;width:82px;height:82px;border:1px solid #7dd3fc66;border-radius:50%;background:radial-gradient(circle at 50% 40%,#23465c,#0b1829 70%);box-shadow:0 0 32px #38bdf822,inset 0 0 22px #38bdf822}
.tl-ops-orbit::before,.tl-ops-orbit::after{content:"";position:absolute;inset:-8px;border:1px solid #7dd3fc35;border-radius:50%;transform:rotate(-25deg) scaleY(.42)}
.tl-ops-orbit::after{inset:-15px;transform:rotate(38deg) scaleY(.36);border-color:#c4b5fd36}
.tl-ops-orbit span{font-size:29px;line-height:1.1;filter:drop-shadow(0 0 10px #67e8f8)}
.tl-ops-orbit small{margin-top:3px;color:#cbd5e1;font-size:8px;font-weight:800;letter-spacing:1px}
.tl-ops-footer{display:flex;align-items:center;justify-content:space-between;gap:9px;padding:11px 17px;border-top:1px solid #ffffff12;background:#02061735}
.tl-ops-data{display:flex;min-width:0;flex-direction:column}
.tl-ops-data b{font-size:13px}
.tl-ops-data small{overflow:hidden;color:#94a3b8;font-size:10px;text-overflow:ellipsis;white-space:nowrap}
.tl-ops-launch{display:flex;min-height:40px;align-items:center;justify-content:center;gap:6px;flex:none;padding:0 11px;border:1px solid #67e8f866;border-radius:11px;background:#0e749033;color:#e0f2fe;font-size:11px;font-weight:900;letter-spacing:.35px}
.tl-ops-launch i{font-size:13px;font-style:normal}
.tl-ops-progress{display:flex;align-items:center;gap:9px;padding:0 17px 13px;color:#7f91a9;font-size:8px;font-weight:800;letter-spacing:.8px}
.tl-ops-progress>span{flex:none}
.tl-ops-progress>i{display:block;height:4px;flex:1;overflow:hidden;border-radius:5px;background:#26344a}
.tl-ops-progress>i>b{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--ops-accent),#67e8f8);box-shadow:0 0 10px var(--ops-accent)}
.tl-mode-heading{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:8px 2px 9px}
.tl-mode-heading div{display:flex;flex-direction:column}
.tl-mode-heading span{color:#7dd3fc;font-size:9px;font-weight:900;letter-spacing:1.6px}
.tl-mode-heading b{font-size:15px}
.tl-mode-heading>small{color:#64748b;font-size:9px;font-weight:800;letter-spacing:.8px}
.tl-run-mode{border-color:#f8717180}
@keyframes tlPulse{50%{opacity:.42;box-shadow:0 0 3px var(--ops-accent)}}
@media(max-width:380px){.tl-ops-top{grid-template-columns:minmax(0,1fr) 72px;padding:15px 13px 10px}.tl-ops-orbit{width:66px;height:66px}.tl-ops-orbit span{font-size:24px}.tl-ops-card h2{font-size:19px}.tl-ops-footer{padding:10px 13px}.tl-ops-launch{padding:0 8px;font-size:10px}.tl-ops-progress{padding:0 13px 12px}}
@media(prefers-reduced-motion:reduce){.tl-ops-card,.tl-ops-orbit,.tl-ops-kicker i{animation:none;transition:none}}
`;
document.head.appendChild(TL_investmentStyle);

load();init();render();
</script>
</body>
</html>
