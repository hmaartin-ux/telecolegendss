<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Telecom Legends">
<title>Telecom Legends</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./telecom-legends-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
/* VOICE: arcade de cartas coleccionables, enérgico pero legible para estudiar
   IDEA: un "Ultimate Team" de la telecomunicación: sobres, ligas, cartas ICON
   PICTURE: cartas con brillo por rareza, mapa de niveles y duelo contra rival
   COLOUR and TYPE: noche azul profundo, violeta eléctrico, oro; Russo One + Inter
   LAYOUT: una columna móvil, barra de recursos arriba, navegación abajo */
:root{color-scheme:dark;--bg:#0a0e1a;--bg2:#121829;--bg3:#1a2236;--ln:#25304d;--tx:#e8ecf5;--mut:#8b95ad;--acc:#7c5cff;--acc2:#22d3ee;--ok:#22c55e;--bad:#ef4444;--gold:#fbbf24}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip}
body{background:radial-gradient(1200px 600px at 50% -200px,#1d1550 0%,var(--bg) 60%) fixed}
button{font:inherit;cursor:pointer;touch-action:manipulation}
input,textarea,select{font:16px Inter,system-ui,sans-serif;width:100%;background:#05070d;color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin:6px 0 12px}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
#top{position:sticky;top:0;z-index:20;background:rgba(10,14,26,.92);backdrop-filter:blur(8px);display:flex;gap:6px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;justify-content:space-between;border-bottom:1px solid var(--ln)}
.pill{background:var(--bg3);border-radius:999px;padding:5px 10px;font-weight:800;font-size:14px;white-space:nowrap}
#view{flex:1;padding:14px}
#nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#0d1222;border-top:1px solid var(--ln);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
#nav .in{display:flex;max-width:560px;width:100%}
#nav button{flex:1;background:none;border:0;color:var(--mut);padding:8px 0 10px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px}
#nav button span{font-size:21px;line-height:1}
#nav button.on{color:#fff}
h2,h3{font-family:"Russo One",Inter,sans-serif;font-weight:400;margin:.2em 0 .6em;line-height:1.1}
h2{font-size:24px}h3{font-size:18px}
.mut{color:var(--mut);font-size:13px}
.card-box{background:var(--bg2);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px}
.card-box summary{cursor:pointer}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:800;font-size:15px;color:#fff;background:linear-gradient(135deg,#7c5cff,#5b8cff);width:100%;box-shadow:0 4px 0 #3b2fa8;transition:transform .08s;min-height:46px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #3b2fa8}
.btn.big{font-family:"Russo One",sans-serif;font-size:20px;padding:18px;letter-spacing:.5px}
.btn.sec{background:var(--bg3);box-shadow:0 4px 0 #070a14}
.btn.gold{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#1a1200;box-shadow:0 4px 0 #a16207}
.btn.green{background:linear-gradient(135deg,#16a34a,#22c55e);box-shadow:0 4px 0 #14532d}
.btn.sm{width:auto;padding:8px 12px;min-height:36px;font-size:13px}
.btn:disabled{opacity:.4;pointer-events:none}
.lnk{background:none;border:0;color:var(--acc2);font-weight:700;padding:6px 0;font-size:14px}
.row{display:flex;gap:8px}.row>*{flex:1}
.rowb{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.chip{border:1px solid var(--ln);background:var(--bg3);color:var(--tx);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:600;min-height:38px}
.chip.on{background:var(--acc);border-color:var(--acc)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.xpbar{height:8px;background:#1f2840;border-radius:9px;overflow:hidden;margin:8px 0 4px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:9px}
.hero{text-align:center;padding:18px 14px;margin-bottom:14px;border-radius:20px;background:linear-gradient(160deg,#1c1450,#0f1730);border:1px solid #2e2870}
.lg{font-family:"Russo One",sans-serif;font-size:30px;margin:2px 0}
.glow{border-color:#a16207;box-shadow:0 0 24px rgba(251,191,36,.18)}
.difb{background:var(--bg3);border:2px solid var(--ln);color:var(--tx);border-radius:14px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:76px}
.difb b{color:var(--c)}.difb small{color:var(--mut);font-size:12px}
.difb.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--bg3))}
.tog{display:flex;gap:10px;align-items:center;font-size:14px;margin:0 0 14px;color:var(--mut)}
.tog input{width:22px;height:22px;margin:0;flex:none}
/* juego */
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:14px;font-weight:700}
.vs{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(90deg,#1b2a5a,#3a1530);border-radius:14px;padding:8px 14px;margin-bottom:8px;font-weight:800;font-size:14px}
.timer{height:10px;background:#1f2840;border-radius:9px;overflow:hidden;margin:6px 0 10px}
.timer i{display:block;height:100%;background:var(--ok);transition:width .1s linear}
.tagq{font-size:12px;color:var(--mut);margin-bottom:6px;border-left:3px solid var(--c);padding-left:8px}
.qtext{font-size:17px;line-height:1.5;white-space:pre-wrap;background:var(--bg2);border-radius:16px;padding:16px;margin-bottom:10px;border:1px solid var(--ln);overflow-x:auto}
.qtext.sm{font-size:15px}
.opt{display:block;width:100%;text-align:left;background:var(--bg3);border:2px solid var(--ln);color:var(--tx);border-radius:14px;padding:13px 14px;margin-bottom:9px;font-size:15px;white-space:pre-wrap;min-height:50px;overflow-x:auto}
.opt.ok{border-color:var(--ok);background:#0f2e1c}
.opt.bad{border-color:var(--bad);background:#3a1215}
.opt.gone{opacity:.2;pointer-events:none}
.tools{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tool{background:var(--bg3);border:1px solid var(--ln);color:#fff;border-radius:12px;padding:8px 12px;font-weight:700;font-size:14px;min-height:40px}
.tool.ab{background:linear-gradient(125deg,#5b2a86,#1e3a8a);border-color:#8b5cf6}
.verdict{font-family:"Russo One",sans-serif;font-size:20px;margin:8px 0}
.verdict.g{color:var(--ok)}.verdict.r{color:var(--bad)}
.sol{background:#0f1a30;border-left:4px solid var(--acc);border-radius:10px;padding:12px;margin:10px 0;white-space:pre-wrap;font-size:14px;line-height:1.6;overflow-x:auto}
.okans{color:var(--ok);font-weight:700;margin:8px 0;white-space:pre-wrap}
pre.code{background:#05070d;border-radius:10px;padding:10px;overflow:auto;font-size:13px;white-space:pre;margin:8px 0;font-family:ui-monospace,Menlo,Consolas,monospace;color:#c9d6ff}
.tblw{background:var(--bg2);border:1px solid var(--ln);border-radius:14px;padding:10px;margin-bottom:10px;overflow-x:auto}
.tbt{font-weight:800;font-size:13px;margin-bottom:6px;color:var(--acc2)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--ln);padding:6px 8px;text-align:left;white-space:nowrap}
th{color:var(--mut);font-weight:700;font-size:12px}
.res{text-align:center;padding:22px 10px;border-radius:20px;margin-bottom:14px;background:var(--bg2);border:1px solid var(--ln)}
.res.win{background:linear-gradient(160deg,#14532d,#0f1730)}.res.lose{background:linear-gradient(160deg,#4c1018,#0f1730)}
.res .big{font-family:"Russo One",sans-serif;font-size:30px}
.stars{font-size:30px;color:var(--gold);letter-spacing:4px}
.sbox{background:var(--bg2);border:1px solid var(--ln);border-radius:14px;padding:10px;text-align:center}
.sbox b{display:block;font-size:20px}.sbox small{color:var(--mut)}
/* mundos */
.world{position:relative;border:0;border-radius:18px;padding:14px;color:#fff;text-align:left;background:linear-gradient(150deg,color-mix(in srgb,var(--c) 70%,#000),#0f1730 85%);display:flex;flex-direction:column;gap:2px;min-height:150px;box-shadow:0 6px 0 color-mix(in srgb,var(--c) 35%,#000)}
.world.locked{filter:grayscale(.85);opacity:.6}
.world .wi{font-size:34px}.world small{opacity:.85;font-size:12px}
.crown{position:absolute;top:10px;right:12px;font-size:22px}
.lvls{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:10px 0 4px}
.lvl{aspect-ratio:1;border-radius:50%;border:3px solid var(--c);background:color-mix(in srgb,var(--c) 22%,var(--bg3));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;padding:0;min-width:0}
.lvl small{font-size:10px;color:var(--gold);line-height:1}
.lvl.lk{border-color:var(--ln);background:var(--bg3);opacity:.6}
.lvn{font-size:11px}
.boss{background:linear-gradient(150deg,#3b0a0a,#121829);border-color:#7f1d1d}
.boss.lk{filter:grayscale(.7)}
/* sobres */
.pack{display:flex;gap:14px;align-items:center;border-radius:18px;padding:14px;margin-bottom:12px;cursor:pointer;border:1px solid var(--ln);background:var(--bg2)}
.pk-art{width:64px;height:84px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 6px 14px rgba(0,0,0,.5)}
.pk-n .pk-art{background:linear-gradient(145deg,#334155,#64748b)}
.pk-p .pk-art{background:linear-gradient(145deg,#b45309,#fde68a,#b45309)}
.pk-i .pk-art{background:linear-gradient(125deg,#ff6ad5,#ad8cff,#94d0ff,#7cffcb,#ffe66d);background-size:300% 300%;animation:holo 3s linear infinite}
.pk-t .pk-art{background:linear-gradient(145deg,#075985,#22d3ee,#a5f3fc)}
.pk-m .pk-art{background:linear-gradient(145deg,#581c87,#c084fc,#f0abfc)}
.mutation-mark{position:absolute;z-index:5;left:5px;bottom:5px;width:20px;height:20px;display:grid;place-items:center;border-radius:50%;background:#111827;color:#fff;font-size:12px;box-shadow:0 0 0 1px rgba(255,255,255,.55)}
.pack .price{margin-left:auto;font-weight:800;white-space:nowrap}
/* cartas */
.gcard{transform:perspective(600px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out;will-change:transform;position:relative;aspect-ratio:5/7;border-radius:14px;padding:8px 7px;overflow:hidden;font-weight:800;display:flex;flex-direction:column;box-shadow:0 6px 16px rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.25)}
.r-B{background:linear-gradient(145deg,#6b3f1d,#c8894e 45%,#8a5328);color:#fff3e6}
.r-P{background:linear-gradient(145deg,#5f6b7a,#e8edf3 45%,#97a3b1);color:#151b27}
.r-O{background:linear-gradient(145deg,#a16207,#fde68a 45%,#d4a017);color:#2a1a00}
.r-I{background:linear-gradient(125deg,#ff6ad5,#c774e8,#ad8cff,#8795e8,#94d0ff,#7cffcb,#ffe66d,#ff6ad5);background-size:300% 300%;animation:holo 4s linear infinite;color:#140a24;border-color:#fff}
.r-I::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 45%,transparent 60%);background-size:250% 100%;animation:shine 2.6s infinite;pointer-events:none}
@keyframes holo{0%{background-position:0% 50%}100%{background-position:300% 50%}}
@keyframes shine{0%{background-position:150% 0}100%{background-position:-100% 0}}
.gcard .rt{font-size:9px;letter-spacing:1px;opacity:.85}
.gcard .em{font-size:clamp(24px,8vw,38px);text-align:center;margin:4px 0 2px;line-height:1.1}
.gcard .nm{font-size:clamp(10px,2.8vw,12px);text-align:center;line-height:1.15;min-height:2.3em}
.gcard .as{font-size:9px;text-align:center;opacity:.8;margin-bottom:2px}
.gcard .st{display:grid;grid-template-columns:1fr 1fr;font-size:9px;gap:0 4px;margin-top:auto;font-variant-numeric:tabular-nums}
.gcard .cu{position:absolute;top:5px;left:50%;transform:translateX(-50%);font-size:9px;opacity:.7}
.gcard .lv{position:absolute;top:6px;right:7px;font-size:10px}
.gcard.locked{background:#141b2e;color:#3a4566;border-color:#1f2840;box-shadow:none}
.gcard .cnt{position:absolute;bottom:22px;right:5px;font-size:10px;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:1px 5px}
.pick{border-radius:16px;outline:3px solid transparent;transition:outline-color .15s}
.pick.sel{outline-color:var(--acc2)}
.slot{aspect-ratio:5/7;border:2px dashed var(--ln);border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:28px}
.dcard{width:180px;margin:0 auto 12px}
/* apertura */
.pack-stage{display:flex;gap:10px;justify-content:center;margin-top:12px}
.flip{width:31%;max-width:150px;perspective:900px;cursor:pointer;position:relative}
.flip .in{position:relative;aspect-ratio:5/7;transition:transform .7s cubic-bezier(.2,.8,.2,1.2);transform-style:preserve-3d}
.flip.open .in{transform:rotateY(180deg)}
.dorso,.frontc{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.frontc{transform:rotateY(180deg)}
.dorso{border-radius:14px;background:repeating-linear-gradient(45deg,#1a1450 0 10px,#22196a 10px 20px);border:2px solid #7c5cff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Russo One",sans-serif;font-size:22px;color:#c4b5fd;animation:wob 1.6s ease-in-out infinite}
.dorso span{font-size:34px}
@keyframes wob{50%{transform:translateY(-4px)}}
.flip.open.g-O{filter:drop-shadow(0 0 14px #fbbf24)}
.flip.open.g-I{filter:drop-shadow(0 0 22px #ff6ad5);animation:pop .6s}
@keyframes pop{40%{transform:scale(1.12)}}
.newb{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;font-size:10px;font-weight:800;border-radius:8px;padding:2px 6px;z-index:2}
.newb.dup{background:#475569}
/* menú y otros */
.menu{display:flex;align-items:center;gap:12px;width:100%;background:var(--bg2);border:1px solid var(--ln);color:var(--tx);border-radius:14px;padding:12px 14px;margin-bottom:8px;text-align:left;min-height:60px}
.menu span{font-size:24px}.menu div{flex:1;display:flex;flex-direction:column}.menu small{color:var(--mut);font-size:12px}.menu i{color:var(--mut);font-style:normal;font-size:22px}
.okb{background:#0f2e1c;border:1px solid #166534;border-radius:12px;padding:10px;margin:10px 0;font-size:14px}
.err{background:#3a1215;border:1px solid #7f1d1d;border-radius:12px;padding:10px;margin:10px 0;font-size:14px}
.srow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 40px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.srow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbar{height:8px;background:#1f2840;border-radius:6px;overflow:hidden}.sbar i{display:block;height:100%}
.srow small{text-align:right;font-variant-numeric:tabular-nums}
.road{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.road b{width:74px;flex:none}.road span{flex:1;font-size:14px}
.road.can{border-color:#a16207}.road.got{opacity:.55}
.mrow{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:6px 0;border-bottom:1px solid var(--ln);gap:8px}
.del{background:#3a1215;border:1px solid #7f1d1d;color:#fca5a5;border-radius:10px;padding:6px 10px;font-size:12px;font-weight:700}
/* modal, calculadora, toast */
.hidden{display:none!important}
#modal{position:fixed;inset:0;background:rgba(3,5,12,.86);z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}
.mbox{position:relative;background:var(--bg2);border-radius:18px;padding:18px 16px;max-width:520px;width:100%;max-height:90vh;overflow:auto;border:1px solid var(--ln)}
.mx{position:absolute;top:8px;right:10px;background:none;border:0;color:var(--mut);font-size:22px;width:40px;height:40px}
#calc{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#0d1222;border-top:2px solid var(--acc);border-radius:18px 18px 0 0;padding:10px 10px calc(10px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;box-shadow:0 -10px 30px rgba(0,0,0,.6);max-height:78vh;overflow:auto}
.chead{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:8px}
.ctabs{display:flex;gap:4px;flex-wrap:wrap}
.ctabs button{background:var(--bg3);border:1px solid var(--ln);color:var(--tx);border-radius:9px;padding:6px 10px;font-size:13px;font-weight:700;min-height:34px}
.ctabs button.on{background:var(--acc)}
.cx{background:none;border:0;color:var(--mut);font-size:22px;width:40px;height:40px}
.cdisp{background:#05070d;border-radius:10px;padding:8px 10px;min-height:66px;text-align:right;font-family:ui-monospace,Menlo,Consolas,monospace}
.cexpr{font-size:16px;color:#cfd6e6;word-break:break-all;min-height:22px}
.cres{font-size:22px;font-weight:800;color:#fff;word-break:break-all}.cres.prev{color:#64748b;font-size:17px}
.ckeys{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin-top:8px}
.ckeys button{background:var(--bg3);border:0;color:#fff;border-radius:9px;padding:0;font-size:15px;font-weight:700;min-height:42px}
.ckeys .k-op{background:#26305a}.ckeys .k-fn{background:#1d2a3f;font-size:13px}.ckeys .k-pre{background:#17203a;color:var(--acc2)}.ckeys .k-clr{background:#4c1018}
.ckeys .eq{grid-column:1/-1;background:var(--acc);font-size:20px}
.conv label{font-size:13px;color:var(--mut)}
#toast{position:fixed;top:62px;left:50%;transform:translate(-50%,-20px);z-index:90;background:#1f2a4d;border:1px solid var(--acc);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.conf{position:fixed;top:-12px;width:8px;height:14px;z-index:95;pointer-events:none;animation:fall linear forwards;border-radius:2px}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.flash{position:fixed;inset:0;background:radial-gradient(circle,#fff,rgba(255,106,213,.4) 50%,transparent 75%);z-index:94;pointer-events:none;animation:fl .7s forwards}
@keyframes fl{from{opacity:1}to{opacity:0}}
math{font-size:1.08em}
@media (prefers-reduced-motion:reduce){.r-I,.r-I::after,.dorso,.pk-i .pk-art{animation:none}.flip .in{transition:none}}
.shake{animation:shk .35s}
@keyframes shk{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.float{position:fixed;left:50%;top:40%;transform:translateX(-50%);z-index:96;font-family:"Russo One",sans-serif;font-size:26px;color:#fde047;text-shadow:0 2px 10px rgba(0,0,0,.7);pointer-events:none;animation:flt 1s forwards;white-space:nowrap}
@keyframes flt{to{transform:translate(-50%,-90px);opacity:0}}
.vs{position:relative}
.bubble{position:absolute;right:8px;top:-30px;background:#fff;color:#111;font-size:12px;font-weight:700;border-radius:12px;padding:4px 10px;animation:pop .3s;white-space:nowrap;z-index:3}

.petcell{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:16px;background:var(--bg2);border:2px solid var(--ln);color:inherit;font:inherit;cursor:pointer}
.petcell.on{border-color:#fde047;box-shadow:0 0 0 3px #fde04733}.petcell.lock{cursor:default;opacity:.9}.petcell small{color:var(--mut)}.petcell .xpbar{width:80%}
.egg{animation:pwob 3s ease-in-out infinite;transform-origin:60px 100px}@keyframes pwob{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-6deg)}90%{transform:rotate(6deg)}95%{transform:rotate(-3deg)}}
#petmini{position:fixed;right:8px;bottom:150px;z-index:60;display:flex;align-items:flex-end;gap:4px;pointer-events:none;transition:opacity .3s}
#petmini.hidden{opacity:0}#petmini .pbub{background:#f8fafc;color:#0f172a;font-size:12px;font-weight:800;border-radius:12px;padding:5px 9px;max-width:170px;margin-bottom:34px;box-shadow:0 4px 12px #0007}
#petmini.joy .pfig{animation:pjump .6s ease 2}#petmini.sad .pfig{animation:psad .8s ease}@keyframes psad{40%{transform:rotate(-8deg) translateY(4px)}}
.xbox .xhead{display:flex;gap:10px;align-items:center;margin-bottom:8px}.xbox .xhead small{display:block}
.xbox .xq{font-size:13px;color:var(--mut);border-left:3px solid #7c3aed;padding:4px 10px;margin-bottom:10px;max-height:110px;overflow:auto}
.xbody{white-space:pre-wrap;line-height:1.55;font-size:15px;min-height:80px;overflow-x:auto}
.xbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.xbtn{margin:8px 0 0}
.typing{display:inline-flex;gap:5px;padding:8px}.typing i{width:8px;height:8px;border-radius:50%;background:#a78bfa;animation:ptype 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes ptype{50%{transform:translateY(-6px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.pet-idle .pbody,.petsvg .peyes,.egg,.pet-talk .pbody,.petsvg .spark{animation:none}}

Q(T1,3,'Un vídeo sin comprimir de 640×480 píxeles, 24 bpp y 25 fps. ¿Qué régimen binario necesita?',['184,32 Mbps','23,04 Mbps','7,37 Mbps','7,68 Mbps'],'$R=640\\cdot480\\cdot24\\cdot25=184\\,320\\,000$ bps = 184,32 Mbps\n(23,04 es el mismo valor en MB/s; 7,37 Mbps sale de olvidar los fps; 7,68 Mbps, de olvidar los bpp.)',1),
Q(T1,3,'Enlace de 2000 km de fibra ($v_{prop}=2\\cdot10^8$ m/s) a $R=100$ Mbps, con paquetes de 1250 bytes. Despreciando el procesado y las esperas, ¿cuánto vale $D$?',['10,1 ms','10 ms','6,77 ms','20,1 ms'],'$t_{prop}=\\frac{2\\cdot10^6}{2\\cdot10^8}=10$ ms\n$t_{tx}=\\frac{1250\\cdot8}{10^8}=0{,}1$ ms\n$D=t_{prop}+t_{tx}=10{,}1$ ms\n(6,77 ms sale de usar $c_0$ en lugar de $v_{prop}$.)',1),

Q(T2,1,'¿Cuáles son las tres fases de la conmutación de circuitos?',['Establecimiento, transferencia y liberación','Encaminamiento, almacenamiento y reenvío','Segmentación, transmisión y reensamblado','Sondeo, selección y confirmación'],'Se establece un circuito dedicado, se transfieren los datos y se libera el circuito.'),
Q(T2,2,'Un mensaje de 10 000 bytes se divide en paquetes con $L_{datos}=1500$ bytes. ¿Cuántos paquetes hacen falta?',['7','6','8','67'],'$N_{paq}=\\left\\lceil\\frac{10000}{1500}\\right\\rceil=\\lceil6{,}67\\rceil=7$',1),

un sistema LTI discreto es...", "ops": ["$y[n]=\\sum_k x[k]\\,h[n-k]$", "$y[n]=x[n]\\,h[n]$", "$y[n]=\\sum_k x[k]\\,h[k]$", "$y[n]=x[n]+h[n]$"], "ok": 0, "sol": "Suma de convolución: $y[n]=x[n]*h[n]=\\sum_{k=-\\infty}^{\\infty}x[k]h[n-k]$.", "calc": false}, {"asig": "SYS", "tema": "T2 Sistemas LTI", "dif": 2, "q": "Un sistema LTI es causal si y solo si...", "ops": ["$h(t)=0$ para $t<0$", "$h(t)=0$ para $t>0$", "$\\int|h(t)|dt<\\infty$", "$h(0)=1$"], "ok": 0, "sol": "Causalidad LTI: la respuesta al impulso es nula para tiempos negativos.", "calc": false}, {"asig": "SYS", "tema": "T2 Sistemas LTI", "dif": 2, "q": "Un sistema LTI discreto es estable (BIBO) si y solo si...", "ops": ["$\\sum_n |h[n]|<\\infty$", "$h[n]=0$ para $n<0$", "$|h[n]|<1$ para todo $n$", "$\\sum_n h[n]=1$"], "ok": 0, "sol": "Estabilidad BIBO: la respuesta al impulso es absolutamente sumable (integrable en continuo).", "calc": false}, {"asig": "SYS", "tema": "T2 Sistemas LTI", "dif": 2, "q": "Dos sistemas LTI en serie, $h_1$ y $h_2$, equivalen a uno con...", "ops": ["$h=h_1*h_2$", "$h=h_1+h_2$", "$h=h_1\\cdot h_2$", "$h=h_1-h_2$"], "ok": 0, "sol": "En serie (cascada) se convolucionan las respuestas al impulso; en paralelo se suman.", "calc": false}, {"asig": "SYS", "tema": "T2 Sistemas LTI", "dif": 2, "q": "¿Es estable el sistema con $h[n]=(0{,}5)^n u[n]$?", "ops": ["Sí: $\\sum (0{,}5)^n=2$", "No: la suma diverge", "No es causal", "Solo si la entrada es acotada por 1"], "ok": 0, "sol": "$\\sum_{n\\ge0}0{,}5^n=\\frac{1}{1-0{,}5}=2<\\infty$: es estable.", "calc": false}, {"asig": "SYS", "tema": "T2 Sistemas LTI", "dif": 3, "q": "Convolución $x[n]*h[n]$ con $x[n]=\\delta[n]+2\\delta[n-1]$ y $h[n]=\\delta[n]-\\delta[n-1]$:", "ops": ["$\\delta[n]+\\delta[n-1]-2\\delta[n-2]$", "$\\delta[n]-2\\delta[n-2]$", "$\\delta[n]+3\\delta[n-1]-2\\delta[n-2]$", "$\\delta[n]+\\delta[n-1]+2\\delta[n-2]$"], "ok": 0, "sol": "$y=h[n]+2h[n-1]=\\delta[n]-\\delta[n-1]+2\\delta[n-1]-2\\delta[n-2]=\\delta[n]+\\delta[n-1]-2\\delta[n-2]$.", "calc": false}, {"asig": "SYS", "tema": "T2 Sistemas LTI", "dif": 3, "q": "$x(t)*\\delta(t-t_0)$ es...", "ops": ["$x(t-t_0)$", "$x(t_0)$", "$x(t)\\delta(t-t_0)$", "$x(t+t_0)$"], "ok": 0, "sol": "Convolucionar con una delta desplazada desplaza la señal: $x(t-t_0)$.", "calc": false}, {"asig": "SYS", "tema": "T2 Sistemas LTI", "dif": 3, "q": "El sistema $y[n]=x[n]+x[n-2]$ (FIR), ¿cuál es su $h[n]$?", "ops": ["$\\delta[n]+\\delta[n-2]$", "$\\delta[n]+\\delta[n+2]$", "$u[n]+u[n-2]$", "$\\delta[n-2]$"], "ok": 0, "sol": "Basta meter $x[n]=\\delta[n]$: $h[n]=\\delta[n]+\\delta[n-2]$.", "calc": false}, {"asig": "SYS", "tema": "T2 Sistemas LTI", "dif": 4, "q": "Sistema con $h(t)=e^{-at}u(t)$. ¿Para qué valores de $a$ es estable?", "ops": ["$a>0$", "$a<0$", "Para todo $a$", "$a=0$"], "ok": 0, "sol": "$\\int_0^\\infty e^{-at}dt$ converge solo si $a>0$ (vale $1/a$).", "calc": false}, {"asig": "SYS", "tema": "T3 Análisis de Fourier", "dif": 1, "q": "¿Qué señales se representan con la Serie de Fourier (SFC)?", "ops": ["Las periódicas", "Las de energía no periódicas", "Solo las discretas", "Solo las causales"], "ok": 0, "sol": "La serie de Fourier representa señales periódicas como suma de armónicos $e^{jk\\omega_0 t}$; la transformada (TFC) sirve para las no periódicas.", "calc": false}, {"asig": "SYS", "tema": "T3 Análisis de Fourier", "dif": 1, "q": "La transformada de Fourier de un pulso rectangular es una función...", "ops": ["sinc", "delta", "escalón", "exponencial"], "ok": 0, "sol": "Pulso rectangular en el tiempo ↔ sinc en frecuencia (y viceversa).", "calc": false}, {"asig": "SYS", "tema": "T3 Análisis de Fourier", "dif": 2, "q": "Con la definición de la asignatura, $\\mathrm{sinc}(\\theta)=\\frac{\\sin(\\pi\\theta)}{\\pi\\theta}$. ¿Dónde están sus nulos?", "ops": ["En $\\theta=\\pm1,\\pm2,\\pm3,\\dots$", "En $\\theta=\\pm\\pi,\\pm2\\pi,\\dots$", "En $\\theta=0$", "En $\\theta=\\pm\\frac12,\\pm\\frac32,\\dots$"], "ok": 0, "sol": "$\\sin(\\pi\\theta)=0$ en $\\theta$ entero; en $\\theta=0$ vale 1.", "calc": false}, {"asig": "SYS", "tema": "T3 Análisis de Fourier", "dif": 2, "q": "Propiedad de convolución de la TF: $x(t)*h(t)\\leftrightarrow$", "ops": ["$X(\\omega)\\,H(\\omega)$", "$X(\\omega)*H(\\omega)$", "$X(\\omega)+H(\\omega)$", "$\\frac{1}{2\\pi}X(\\omega)H(\\omega)$"], "ok": 0, "sol": "Convolución en el tiempo ↔ producto en frecuencia. Por eso la salida de un LTI es $Y(\\omega)=X(\\omega)H(\\omega)$.", "calc": false}, {"asig": "SYS", "tema": "T3 Análisis de Fourier", "dif": 2, "q": "Desplazamiento temporal: $x(t-t_0)\\leftrightarrow$", "ops": ["$e^{-j\\omega t_0}X(\\omega)$", "$e^{j\\omega t_0}X(\\omega)$", "$X(\\omega-t_0)$", "$t_0X(\\omega)$"], "ok": 0, "sol": "Un retardo multiplica el espectro por una fase lineal $e^{-j\\omega t_0}$; el módulo no cambia.", "calc": false}, {"asig": "SYS", "tema": "T3 Análisis de Fourier", "dif": 2, "q": "La TF en tiempo discreto (TFD) $X(\\Omega)$ siempre es...", "ops": ["Periódica de periodo $2\\pi$", "Periódica de periodo $\\pi$", "Real", "No periódica"], "ok": 0, "sol": "$e^{-j\\Omega n}$ se repite cada $2\\pi$ en $\\Omega$, así que $X(\\Omega)$ es $2\\pi$-periódica.", "calc": false}, {"asig": "SYS", "tema": "T3 Análisis de Fourier", "dif": 3, "q": "Una señal real y par tiene una TF...", "ops": ["Real y par", "Imaginaria pura e impar", "Real e impar", "Compleja sin simetría"], "ok": 0, "sol": "Señal real ⇒ $X(-\\omega)=X^*(\\omega)$. Si además es par, $X(\\omega)$ es real y par.", "calc": false}, {"asig": "SYS", "tema": "T3 Análisis de Fourier", "dif": 3, "q": "$e^{-at}u(t)$ con $a>0$ tiene como TF...", "ops": ["$\\frac{1}{a+j\\omega}$", "$\\frac{1}{a-j\\omega}$", "$\\frac{a}{a^2+\\omega^2}$", "$\\frac{1}{j\\omega}$"], "ok": 0, "sol": "$\\int_0^\\infty e^{-at}e^{-j\\omega t}dt=\\frac{1}{a+j\\omega}$.", "calc": false}, {"asig": "SYS", "tema": "T3 Análisis de Fourier", "dif": 3, "q": "Modulación: $x(t)\\cos(\\omega_0 t)\\leftrightarrow$", "ops": ["$\\frac12[X(\\omega-\\omega_0)+X(\\omega+\\omega_0)]$", "$X(\\omega)\\cos(\\omega_0)$", "$X(\\omega-\\omega_0)$", "$2X(\\omega)$"], "ok": 0, "sol": "El coseno traslada el espectro a $\\pm\\omega_0$ con la mitad de amplitud en cada lado.", "calc": false}, {"asig": "SYS", "tema": "T3 Análisis de Fourier", "dif": 4, "q": "Una señal $x(t)$ periódica con $T_0$ tiene coeficientes $X_k$. ¿Cuáles tiene $x(t-t_0)$?", "ops": ["$X_k\\,e^{-jk\\omega_0 t_0}$", "$X_k$", "$X_{k-t_0}$", "$X_k\\,e^{jk\\omega_0 t_0}$"], "ok": 0, "sol": "Mismo resultado que en la TF, evaluado en los armónicos $k\\omega_0$, con $\\omega_0=2\\pi/T_0$.", "calc": false}, {"asig": "SYS", "tema": "T4 Transformadas de Laplace y Z", "dif": 1, "q": "La transformada Z se define como...", "ops": ["$X(z)=\\sum_n x[n]z^{-n}$", "$X(z)=\\sum_n x[n]z^{n}$", "$X(z)=\\int x(t)e^{-st}dt$", "$X(z)=\\sum_n x[n]e^{-j\\Omega n}$"], "ok": 0, "sol": "$X(z)=\\sum_{n=-\\infty}^{\\infty}x[n]z^{-n}$. Sobre la circunferencia $z=e^{j\\Omega}$ es la TFD.", "calc": false}, {"asig": "SYS", "tema": "T4 Transformadas de Laplace y Z", "dif": 1, "q": "La TFC se obtiene de la transformada de Laplace evaluándola en...", "ops": ["$s=j\\omega$ (eje imaginario)", "$s=1$", "$|s|=1$", "$s=\\sigma$ real"], "ok": 0, "sol": "$X(\\omega)=X(s)|_{s=j\\omega}$, siempre que el eje $j\\omega$ esté en la ROC.", "calc": false}, {"asig": "SYS", "tema": "T4 Transformadas de Laplace y Z", "dif": 2, "q": "Un sistema causal en tiempo discreto es estable si...", "ops": ["Todos sus polos están dentro de la circunferencia unidad", "Todos sus polos están fuera de la circunferencia unidad", "Tiene algún cero en $z=1$", "Sus polos están en el semiplano izquierdo"], "ok": 0, "sol": "Equivale a que $|z|=1$ esté en la ROC. Para un sistema causal, la ROC está fuera del polo más externo, así que todos los polos deben cumplir $|p|<1$.", "calc": false}, {"asig": "SYS", "tema": "T4 Transformadas de Laplace y Z", "dif": 2, "q": "Un sistema causal en tiempo continuo es estable si...", "ops": ["Todos sus polos están en el semiplano izquierdo", "Todos sus polos están dentro del círculo unidad", "Tiene ceros en el eje imaginario", "Sus polos están en el semiplano derecho"], "ok": 0, "sol": "El eje $j\\omega$ debe estar en la ROC; para un sistema causal la ROC está a la derecha del polo más a la derecha.", "calc": false}, {"asig": "SYS", "tema": "T4 Transformadas de Laplace y Z", "dif": 2, "q": "Propiedad de retardo de la TZ: $x[n-1]\\leftrightarrow$", "ops": ["$z^{-1}X(z)$", "$zX(z)$", "$X(z-1)$", "$-X(z)$"], "ok": 0, "sol": "Cada retardo de una muestra multiplica por $z^{-1}$.", "calc": false}, {"asig": "SYS", "tema": "T4 Transformadas de Laplace y Z", "dif": 3, "q": "$h[n]=a^n u[n]$ tiene TZ...", "ops": ["$\\frac{1}{1-az^{-1}}$, ROC $|z|>|a|$", "$\\frac{1}{1-az^{-1}}$, ROC $|z|<|a|$", "$\\frac{1}{1+az^{-1}}$, ROC $|z|>|a|$", "$\\frac{z}{z+a}$, ROC $|z|>1$"], "ok": 0, "sol": "Serie geométrica: $\\sum (az^{-1})^n=\\frac{1}{1-az^{-1}}=\\frac{z}{z-a}$, que converge si $|z|>|a|$.", "calc": false}, {"asig": "SYS", "tema": "T4 Transformadas de Laplace y Z", "dif": 3, "q": "$y[n]-0{,}5\\,y[n-1]=x[n]$. ¿Cuál es $H(z)$?", "ops": ["$\\frac{1}{1-0{,}5z^{-1}}$", "$1-0{,}5z^{-1}$", "$\\frac{1}{1+0{,}5z^{-1}}$", "$\\frac{z^{-1}}{1-0{,}5z^{-1}}$"], "ok": 0, "sol": "Aplicando la TZ: $Y(z)(1-0{,}5z^{-1})=X(z)$, así que $H=\\frac{Y}{X}=\\frac{1}{1-0{,}5z^{-1}}$. Polo en $z=0{,}5$: estable si es causal.", "calc": false}, {"asig": "SYS", "tema": "T4 Transformadas de Laplace y Z", "dif": 3, "q": "$h[n]=(-0{,}9)^{n-1}u[n-1]$ (causal). ¿Es estable?", "ops": ["Sí: el polo está en $z=-0{,}9$, dentro de la circunferencia unidad", "No: el polo está en $z=0{,}9$", "No: tiene un retardo", "Sí, porque no tiene ceros"], "ok": 0, "sol": "$H(z)=\\frac{z^{-1}}{1+0{,}9z^{-1}}=\\frac{1}{z+0{,}9}$. Polo en $-0{,}9$, con $|{-0{,}9}|<1$.", "calc": false}, {"asig": "SYS", "tema": "T4 Transformadas de Laplace y Z", "dif": 4, "q": "Evaluación geométrica: un sistema con un cero en $z=-1$ y un polo en $z=0$. ¿Qué tipo de filtro es?", "ops": ["Paso bajo", "Paso alto", "Paso banda", "Todo paso"], "ok": 0, "sol": "$|H(\\Omega)|$ es proporcional a la distancia de $e^{j\\Omega}$ al cero $-1$: máxima en $\\Omega=0$ y nula en $\\Omega=\\pi$. Es paso bajo.", "calc": false}, {"asig": "SYS", "tema": "T5 Muestreo", "dif": 1, "q": "Teorema de muestreo: para recuperar una señal limitada a $B$ rad/s hace falta...", "ops": ["$\\omega_s>2B$", "$\\omega_s>B$", "$\\omega_s<2B$", "$\\omega_s=B/2$"], "ok": 0, "sol": "Nyquist: la frecuencia de muestreo debe superar el doble del ancho de banda para que las réplicas del espectro no se solapen.", "calc": false}, {"asig": "SYS", "tema": "T5 Muestreo", "dif": 1, "q": "¿Qué es el aliasing?", "ops": ["El solapamiento de las réplicas del espectro al muestrear demasiado despacio", "Un ruido de cuantificación", "Un retardo de grupo", "La atenuación del filtro reconstructor"], "ok": 0, "sol": "Si $\\omega_s<2B$, las réplicas desplazadas $k\\omega_s$ se solapan y la señal original ya no se puede recuperar.", "calc": false}, {"asig": "SYS", "tema": "T5 Muestreo", "dif": 2, "q": "Al muestrear idealmente con un tren de deltas de periodo $T_s$, el espectro $X_s(\\omega)$...", "ops": ["Son réplicas de $X_c(\\omega)$ cada $\\omega_s$, escaladas por $1/T_s$", "Es igual a $X_c(\\omega)$", "Se comprime un factor $T_s$", "Desaparece fuera de $|\\omega|<B$"], "ok": 0, "sol": "$X_s(\\omega)=\\frac{1}{T_s}\\sum_k X_c(\\omega-k\\omega_s)$.", "calc": false}, {"asig": "SYS", "tema": "T5 Muestreo", "dif": 2, "q": "Una señal tiene $f_{max}=4$ kHz. ¿Cuál es la frecuencia de muestreo mínima?", "ops": ["8 kHz", "4 kHz", "2 kHz", "16 kHz"], "ok": 0, "sol": "$f_s>2f_{max}=8$ kHz (en la práctica, algo más).", "calc": true}, {"asig": "SYS", "tema": "T5 Muestreo", "dif": 2, "q": "El filtro de reconstrucción ideal es un paso bajo con corte en...", "ops": ["$\\omega_s/2$ y ganancia $T_s$", "$\\omega_s$ y ganancia 1", "$2\\omega_s$ y ganancia $T_s$", "$B/2$ y ganancia $1/T_s$"], "ok": 0, "sol": "Se queda con la réplica central (corte entre $B$ y $\\omega_s-B$, típicamente $\\omega_s/2$) y compensa el factor $1/T_s$ con ganancia $T_s$.", "calc": false}, {"asig": "SYS", "tema": "T5 Muestreo", "dif": 3, "q": "Al pasar a discreto con $T_s$, la frecuencia analógica $\\omega$ se convierte en...", "ops": ["$\\Omega=\\omega T_s$", "$\\Omega=\\omega/T_s$", "$\\Omega=2\\pi\\omega$", "$\\Omega=\\omega$"], "ok": 0, "sol": "$x[n]=x_c(nT_s)$, de modo que $\\Omega=\\omega T_s$. La frecuencia $\\omega_s/2$ corresponde a $\\Omega=\\pi$.", "calc": false}, {"asig": "SYS", "tema": "T5 Muestreo", "dif": 3, "q": "Se muestrea $\\cos(\\omega_0 t)$ con $\\omega_s=1{,}33\\,\\omega_0$. ¿Qué ocurre?", "ops": ["Aliasing: aparece una sinusoide a $\\omega_s-\\omega_0=0{,}33\\,\\omega_0$", "Se reconstruye perfectamente", "La salida es nula", "Aparece $2\\omega_0$"], "ok": 0, "sol": "$\\omega_s<2\\omega_0$: la réplica en $\\omega_s-\\omega_0$ cae dentro de la banda del filtro y se reconstruye una frecuencia falsa.", "calc": true}, {"asig": "SYS", "tema": "T5 Muestreo", "dif": 3, "q": "Una señal limitada a $B=2\\pi\\cdot 3000$ rad/s se muestrea con $f_s=8$ kHz. ¿A qué $\\Omega$ corresponde su máxima frecuencia?", "ops": ["$\\Omega=0{,}75\\pi$", "$\\Omega=0{,}375\\pi$", "$\\Omega=1{,}5\\pi$", "$\\Omega=3\\pi$"], "ok": 0, "sol": "$\\Omega=\\omega T_s=2\\pi\\cdot\\frac{3000}{8000}=0{,}75\\pi$.", "calc": true}, {"asig": "SYS", "tema": "T5 Muestreo", "dif": 4, "q": "Procesado discreto: $x_c(t)$ con $B<\\omega_s/2$ pasa por C/D, un filtro discreto $H(\\Omega)$ y D/C. ¿Cuál es la respuesta continua equivalente?", "ops": ["$H_{eq}(\\omega)=H(\\omega T_s)$ para $|\\omega|<\\omega_s/2$, y 0 fuera", "$H(\\omega)$ sin cambios", "$H(\\omega/T_s)$ en todo $\\omega$", "$T_sH(\\omega)$"], "ok": 0, "sol": "Sin aliasing, el sistema completo equivale a un LTI continuo con $H_{eq}(\\omega)=H(\\Omega)|_{\\Omega=\\omega T_s}$ dentro de la banda de Nyquist.", "calc": false}, {"asig": "RST2", "tema": "T1 3, 17 y 19"], "ok": 0, "sol": "$\\mathrm{mcd}(84,990)=6$; tiene solución si y solo si $6\\mid c$.", "calc": true}, {"asig": "MAT3", "tema": "T1 Aritmética entera y modular", "dif": 3, "q": "Número de soluciones enteras no negativas de $20x+50y=510$:", "ops": ["5", "3", "4", "6"], "ok": 0, "sol": "Equivale a $2x+5y=51$, así que $y$ es impar: $y=1,3,5,7,9$ dan $x=23,18,13,8,3$.", "calc": true}, {"asig": "MAT3", "tema": "T1 Aritmética entera y modular", "dif": 3, "q": "$3^{100}\\bmod 7$:", "ops": ["4", "1", "3", "2"], "ok": 0, "sol": "Fermat: $3^6\\equiv1\\pmod7$. $100=6\\cdot16+4$, luego $3^{100}\\equiv3^4=81\\equiv4$.", "calc": true}, {"asig": "MAT3", "tema": "T1 Aritmética entera y modular", "dif": 4, "q": "Soluciones de $4x\\equiv2\\pmod 6$:", "ops": ["$x\\equiv2$ y $x\\equiv5\\pmod6$", "No tiene", "Solo $x\\equiv2$", "$x\\equiv1\\pmod6$"], "ok": 0, "sol": "$\\mathrm{mcd}(4,6)=2$ divide a 2: hay 2 soluciones módulo 6. Dividiendo: $2x\\equiv1\\pmod3\\Rightarrow x\\equiv2\\pmod3$, es decir, $x=2$ o $5$.", "calc": true}, {"asig": "MAT3", "tema": "T2 Sistemas de ecuaciones lineales", "dif": 1, "q": "Por Rouché-Frobenius, un sistema es compatible determinado si...", "ops": ["$\\mathrm{rg}(A)=\\mathrm{rg}(A|b)=n$ (número de incógnitas)", "$\\mathrm{rg}(A)<\\mathrm{rg}(A|b)$", "$\\mathrm{rg}(A)=\\mathrm{rg}(A|b)<n$", "$\\det(A)=0$"], "ok": 0, "sol": "Igual rango y menor que $n$: indeterminado. Distinto rango: incompatible.", "calc": false}, {"asig": "MAT3", "tema": "T2 Sistemas de ecuaciones lineales", "dif": 1, "q": "Un sistema homogéneo $Ax=0$...", "ops": ["Siempre es compatible (al menos tiene la solución nula)", "Puede ser incompatible", "Nunca tiene soluciones no nulas", "Siempre es indeterminado"], "ok": 0, "sol": "Tiene soluciones no triviales si y solo si $\\mathrm{rg}(A)<n$.", "calc": false}, {"asig": "MAT3", "tema": "T2 Sistemas de ecuaciones lineales", "dif": 2, "q": "Rango de $\\begin{pmatrix}1&2\\\\2&4\\end{pmatrix}$:", "ops": ["1", "2", "0", "4"], "ok": 0, "sol": "La segunda fila es el doble de la primera.", "calc": false}, {"asig": "MAT3", "tema": "T2 Sistemas de ecuaciones lineales", "dif": 2, "q": "Resuelve $x+y+z=6$, $y+z=5$, $z=3$:", "ops": ["$(1,2,3)$", "$(3,2,1)$", "$(1,3,2)$", "$(2,2,2)$"], "ok": 0, "sol": "Sustitución hacia atrás: $z=3$, $y=2$, $x=1$.", "calc": true}, {"asig": "MAT3", "tema": "T2 Sistemas de ecuaciones lineales", "dif": 3, "q": "Sistema de 3 ecuaciones y 3 incógnitas con $\\mathrm{rg}(A)=2$ y $\\mathrm{rg}(A|b)=3$:", "ops": ["Incompatible", "Compatible determinado", "Compatible indeterminado con 1 parámetro", "Compatible indeterminado con 2 parámetros"], "ok": 0, "sol": "Los rangos son distintos: no hay solución.", "calc": false}, {"asig": "MAT3", "tema": "T2 Sistemas de ecuaciones lineales", "dif": 3, "q": "Sistema de 4 incógnitas con $\\mathrm{rg}(A)=\\mathrm{rg}(A|b)=2$. ¿Cuántos parámetros libres tiene?", "ops": ["2", "4", "1", "0"], "ok": 0, "sol": "Grados de libertad $=n-\\mathrm{rg}=4-2=2$.", "calc": false}, {"asig": "MAT3", "tema": "T3 Espacios vectoriales", "dif": 1, "q": "¿Cuál es la dimensión del espacio de las matrices reales $2\\times2$?", "ops": ["4", "2", "8", "1"], "ok": 0, "sol": "Una base: las 4 matrices con un único 1.", "calc": false}, {"asig": "MAT3", "tema": "T3 Espacios vectoriales", "dif": 1, "q": "$\\{(x,y)\\in\\mathbb{R}^2: x+y=1\\}$, ¿es un subespacio?", "ops": ["No: no contiene al vector nulo", "Sí", "Sí, de dimensión 1", "Solo si $x=y$"], "ok": 0, "sol": "Todo subespacio contiene al 0; $(0,0)$ no cumple $x+y=1$.", "calc": false}, {"asig": "MAT3", "tema": "T3 Espacios vectoriales", "dif": 2, "q": "¿Son linealmente independientes $(1,2)$ y $(2,4)$?", "ops": ["No: uno es múltiplo del otro", "Sí", "Sí, forman una base de $\\mathbb{R}^2$", "Depende de la base"], "ok": 0, "sol": "$(2,4)=2(1,2)$.", "calc": false}, {"asig": "MAT3", "tema": "T3 Espacios vectoriales", "dif": 2, "q": "Dimensión del espacio de polinomios de grado $\\le3$:", "ops": ["4", "3", "5", "Infinita"],
